<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tempo</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Tempo">
<meta name="theme-color" content="#120B2E">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon-v5.png">
<link rel="icon" href="icon-192-v5.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<style>
/* Tempo v3. Layout: dark-first, one column, data in front. Big condensed numerals, hairline cards, glowing rings.
   Type colours keep the bumper-plate code: red = gym, blue = running, yellow = cycling, green = other. */
:root{
  --bg:#F1F2F4; --surface:#FFFFFF; --surface-2:#E9EBEF; --line:#DCDFE5; --fg:#0A0B0E; --muted:#5E6471; --dim:#8A909C;
  --accent:#3D7BFF; --on-accent:#FFFFFF;
  --gym:#E5484D; --run:#2F6FEB; --bike:#D69A00; --other:#1A9B63;
  --ok:#18A35A; --warn:#C98A00; --bad:#D93B3B; --strain:#2F6FEB;
  --display:"SF Pro Display",-apple-system,BlinkMacSystemFont,system-ui,"Segoe UI",Roboto,sans-serif;
  --body:-apple-system,BlinkMacSystemFont,system-ui,"Segoe UI",Roboto,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,monospace;
  --r:22px; --glow:0;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#070809; --surface:#111317; --surface-2:#1A1D23; --line:#23272F; --fg:#F3F4F6; --muted:#8C93A0; --dim:#5C6370;
  --gym:#FF5A5F; --run:#4D8DFF; --bike:#FFC53D; --other:#33D98F;
  --ok:#2EE07A; --warn:#FFC53D; --bad:#FF5A5F; --strain:#4D8DFF; --glow:1; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#070809; --surface:#111317; --surface-2:#1A1D23; --line:#23272F; --fg:#F3F4F6; --muted:#8C93A0; --dim:#5C6370;
  --gym:#FF5A5F; --run:#4D8DFF; --bike:#FFC53D; --other:#33D98F;
  --ok:#2EE07A; --warn:#FFC53D; --bad:#FF5A5F; --strain:#4D8DFF; --glow:1; color-scheme:dark}

*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--body);font-size:16px;line-height:1.4;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased}
body.locked{overflow:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
input,select,textarea{font:inherit;font-size:16px;color:var(--fg)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.ic{flex:none;display:block}
.num{font-variant-numeric:tabular-nums}
.cond{font-stretch:85%}
em{font-style:normal;color:var(--muted);font-weight:500}
a{color:var(--accent)}

#app{max-width:600px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:8px calc(104px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px}
#app.stack{padding-bottom:calc(120px + env(safe-area-inset-bottom,0px))}

.hdr{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding-top:14px}
.eyebrow{font-size:11px;font-weight:750;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.h1{font-family:var(--display);font-size:34px;font-weight:800;letter-spacing:-.035em;margin:2px 0 0;line-height:1.05;text-wrap:balance}
.h2{font-family:var(--display);font-size:20px;font-weight:800;margin:0;line-height:1.2;letter-spacing:-.02em}
.h3{font-size:15px;font-weight:750;margin:0;letter-spacing:-.01em}
.muted{color:var(--muted)} .sm{font-size:14px} .xs{font-size:12.5px}
.sec{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:12px}
.sec .h2{font-size:13px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-family:var(--body)}
p{margin:0}
ol.steps{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:8px;font-size:14.5px;line-height:1.45}
code{font-family:var(--mono);font-size:13px;background:var(--surface-2);padding:2px 6px;border-radius:6px;overflow-wrap:anywhere}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.list{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.li{display:flex;align-items:center;gap:12px;padding:13px 14px;width:100%;min-width:0;border-top:1px solid var(--line)}
.li:first-child{border-top:0}
.li .grow{flex:1;min-width:0}
.li .t{font-weight:650;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}
.li .s{font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}
.chev{color:var(--dim)}

.btn{text-decoration:none;color:inherit;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border-radius:14px;background:var(--surface-2);font-weight:700;font-size:15px;white-space:nowrap}
.btn.primary{background:var(--accent);color:var(--on-accent)}
.btn.xl{min-height:58px;font-size:15px;border-radius:18px;font-weight:850;letter-spacing:.1em;text-transform:uppercase;width:100%}
.btn.sm{min-height:36px;padding:0 12px;font-size:14px;border-radius:11px}
.btn.ghost{background:transparent;color:var(--accent);padding:0 6px}
.btn.danger{background:transparent;color:var(--bad);border:1px solid color-mix(in srgb,var(--bad) 35%,transparent)}
.btn.line{background:transparent;border:1px solid var(--line)}
.btn[disabled]{opacity:.4}
.armed{background:var(--bad)!important;color:#fff!important;border-color:var(--bad)!important;width:auto!important;padding:0 10px!important;border-radius:10px!important;font-size:13px;font-weight:750;white-space:nowrap}
.btn.block{width:100%}
.btn:active,.wtile:active,.li:active,.tile:active{transform:scale(.985)}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}
.btnrow .btn{flex:1}
.iconbtn{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:var(--surface);border:1px solid var(--line);color:var(--fg)}
.iconbtn.sm{width:34px;height:34px;background:var(--surface-2);border:0}

.dot{width:9px;height:9px;border-radius:50%;background:var(--c,var(--muted));flex:none}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:750;padding:3px 9px;border-radius:999px;background:color-mix(in srgb,var(--c,var(--muted)) 15%,transparent);color:var(--c,var(--muted));white-space:nowrap}
.badge{font-size:10.5px;font-weight:850;letter-spacing:.1em;text-transform:uppercase;padding:3px 8px;border-radius:6px;background:var(--accent);color:var(--on-accent)}
.lt{font-family:var(--display);font-weight:800;width:36px;height:36px;border-radius:12px;display:grid;place-items:center;background:color-mix(in srgb,var(--c,var(--muted)) 15%,transparent);color:var(--c,var(--muted));flex:none;font-size:16px}
.lt.s{width:30px;height:30px;border-radius:9px;font-size:14px}

.seg{display:flex;background:var(--surface-2);border-radius:12px;padding:3px;gap:2px;overflow-x:auto}
.seg button{flex:1;min-height:34px;border-radius:9px;font-size:13.5px;font-weight:700;color:var(--muted);padding:0 10px;white-space:nowrap}
.seg button.on{background:var(--surface);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.18)}
.seg.mini button{min-height:30px;font-size:12.5px;padding:0 8px}

.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field>span{font-size:12px;font-weight:750;color:var(--muted);letter-spacing:.02em}
.in{width:100%;min-height:44px;border-radius:12px;border:1px solid var(--line);background:var(--bg);padding:9px 12px;-webkit-appearance:none;appearance:none}
.in.sm{min-height:36px;padding:6px 10px;font-size:15px}
textarea.in{min-height:76px;resize:vertical}
select.in{background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 17px) 50%,calc(100% - 12px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:30px}
.in:focus{outline:none;border-color:var(--accent)}
.in.big{font-family:var(--display);font-size:20px;font-weight:750}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}

.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;min-height:52px;margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding-inline:max(8px,env(safe-area-inset-left,0px));background:color-mix(in srgb,var(--bg) 84%,transparent);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px)}
.tb-back{display:flex;align-items:center;gap:2px;color:var(--accent);font-weight:700;min-height:44px;padding-right:8px;justify-self:start}
.tb-title{font-weight:800;font-size:15px;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:46vw}
.tb-right{justify-self:end;display:flex;gap:8px;align-items:center;padding-right:max(0px,calc(env(safe-area-inset-right,0px) - 8px))}

#tabs{position:fixed;left:0;right:0;bottom:0;z-index:8;display:flex;justify-content:center;padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px));background:color-mix(in srgb,var(--bg) 86%,transparent);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);border-top:1px solid var(--line)}
.tab{flex:1;max-width:120px;display:flex;flex-direction:column;align-items:center;gap:3px;padding:4px 0;color:var(--dim);font-size:10.5px;font-weight:750;letter-spacing:.04em}
.tab.on{color:var(--fg)}
.tab.on .ic{color:var(--accent)}

/* brand */
.brand{display:inline-flex;align-items:center;gap:8px;font-family:var(--display);font-weight:850;font-size:20px;letter-spacing:-.04em;line-height:1}
.brand i{color:var(--accent);font-style:normal}

/* rings and readiness */
.ring{position:relative;width:76px;height:76px}
.ring svg{width:100%;height:100%;transform:rotate(-90deg);overflow:visible}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:17px;font-variant-numeric:tabular-nums;font-stretch:85%}
.ring .prog{filter:drop-shadow(0 0 calc(var(--glow)*6px) currentColor)}
.ready{position:relative;overflow:hidden;padding:18px 16px 16px}
.ready::before{content:"";position:absolute;inset:-40% -20% auto;height:120%;background:radial-gradient(closest-side,color-mix(in srgb,var(--rc,var(--accent)) calc(var(--glow)*18%),transparent),transparent);pointer-events:none}
.rings{display:grid;grid-template-columns:1fr 1fr;gap:8px;position:relative}
.rbig{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;width:100%}
.rbig .ring{width:132px;height:132px}
.rbig .ring b{flex-direction:column;gap:0;line-height:1}
.rbig .ring b span{font-size:42px;letter-spacing:-.04em}
.rbig .ring b small{font-size:10.5px;letter-spacing:.14em;color:var(--muted);font-weight:800;margin-top:4px;font-stretch:100%}
.rbig .lab{font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.rbig .val{font-size:13.5px;font-weight:650}
.ckrow{display:grid;grid-template-columns:auto 1fr;gap:8px 12px;align-items:center;font-size:13px;position:relative}
.ckrow>span{color:var(--muted);font-weight:700}
.ckc{display:flex;gap:6px}
.ckc button{flex:1;min-height:34px;border-radius:10px;background:var(--surface-2);font-weight:800;font-size:14px;color:var(--muted)}
.ckc button.on{background:var(--accent);color:var(--on-accent)}

/* home widgets */
.banner{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:14px 16px;border-radius:var(--r);border:1.5px dashed color-mix(in srgb,var(--accent) 45%,transparent);background:color-mix(in srgb,var(--accent) 7%,transparent);font-size:14.5px}
.banner>div:first-child{flex:1;min-width:200px}
.feat{position:relative;display:flex;flex-direction:column;gap:4px;padding:18px 18px 14px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line);overflow:hidden;width:100%}
.feat .plate{position:absolute;right:-46px;top:-46px;width:180px;height:180px;opacity:.07;pointer-events:none;color:var(--fg)}
.feat-num{font-family:var(--display);font-weight:800;font-size:72px;line-height:.95;letter-spacing:-.045em;font-variant-numeric:tabular-nums;font-stretch:85%;margin-top:6px;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.feat-num.long{font-size:54px}
.feat-unit{font-size:18px;font-weight:750;color:var(--muted);letter-spacing:0;font-stretch:100%}
.feat-sub{color:var(--muted);font-size:14px}
.feat-edit{position:absolute;top:14px;right:14px;font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;padding:5px 10px;border-radius:999px;background:var(--surface-2);color:var(--muted)}
.feat svg.viz{margin-top:10px;width:100%;height:auto;color:var(--accent)}
.live{display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:var(--r);background:var(--accent);color:var(--on-accent);width:100%}
.live .grow{flex:1;min-width:0}
.pulse{width:10px;height:10px;border-radius:50%;background:currentColor;animation:pulse 1.6s infinite}
@keyframes pulse{50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){.pulse{animation:none}}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.wday{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 0;border-radius:12px}
.wday .wl{font-size:10.5px;font-weight:800;color:var(--dim);letter-spacing:.06em}
.wday .wn{font-family:var(--display);font-weight:800;font-size:17px;font-variant-numeric:tabular-nums}
.wday.today{background:var(--surface-2)}
.wday.today .wn{color:var(--accent)}
.wday.future .wn{color:var(--dim)}
.wdots{display:flex;gap:3px;height:8px;align-items:center}
.wdots i{width:7px;height:7px;border-radius:50%;background:var(--c)}
.wdots i.none{background:var(--surface-2)}
.wday.today .wdots i.none{background:var(--line)}
.pc-title{font-family:var(--display);font-size:24px;font-weight:800;line-height:1.1;letter-spacing:-.03em}
.segbar{display:flex;gap:4px}
.segbar i{flex:1;height:5px;border-radius:3px;background:var(--surface-2)}
.segbar i.on{background:var(--c,var(--accent))}
.wgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.wtile{display:flex;align-items:center;gap:10px;padding:10px;border-radius:14px;background:var(--surface-2);min-width:0;text-align:left;position:relative}
.wtile .grow{flex:1;min-width:0}
.wtile b{display:block;font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wtile small{display:flex;align-items:center;gap:4px;font-size:11.5px;color:var(--muted);font-weight:650}
.wtile.done{background:color-mix(in srgb,var(--c) 14%,var(--surface))}
.wtile .ck{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:var(--c);color:#fff;flex:none}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.wchip{display:inline-flex;align-items:center;gap:8px;padding:6px 12px 6px 6px;border-radius:12px;background:var(--surface-2);font-weight:650;font-size:14.5px;min-height:42px;max-width:100%}
.wchip.sel{outline:2px solid var(--c,var(--accent));outline-offset:-2px;background:color-mix(in srgb,var(--c) 10%,var(--surface))}
.tchip{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:999px;border:1px solid var(--line);font-size:13px;font-weight:700;color:var(--muted);white-space:nowrap}
.tchip.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.extra-line{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.tile b{font-family:var(--display);font-size:26px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.05;letter-spacing:-.03em;font-stretch:85%}
.tile b small{font-size:12px;color:var(--muted);font-weight:750;margin-left:2px;font-stretch:100%}
.tile span{font-size:11.5px;color:var(--muted);line-height:1.25;font-weight:600}
.card .tile{background:var(--surface-2);border:0}
@media (max-width:360px){.tiles{grid-template-columns:repeat(2,1fr)}}
.upnext{display:flex;gap:14px;align-items:center}
.upnext .grow{flex:1;min-width:0}
.upnext b{display:block;font-family:var(--display);font-size:22px;font-weight:800;letter-spacing:-.03em}
.insight{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--line)}
.insight:first-of-type{border-top:0;padding-top:0}
.insight .grow{flex:1;min-width:0;font-size:14px;line-height:1.4}
.insight .grow b{display:block;font-size:14.5px}
.insight .ii{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 16%,transparent);color:var(--c);flex:none}
.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.quick button{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 4px;border-radius:14px;background:var(--surface-2);font-size:12px;font-weight:700;color:var(--muted);text-align:center}
.quick button .ic{color:var(--fg)}
.racebig{font-family:var(--display);font-size:56px;font-weight:800;line-height:.95;letter-spacing:-.045em;font-stretch:85%;font-variant-numeric:tabular-nums}

/* goals */
.goals{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px}
.goal{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;min-width:0}
.goal .gl1{font-size:12.5px;font-weight:750;line-height:1.2}
.goal .gl2{font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}

/* plans & editors */
.plancard{display:flex;flex-direction:column;border-radius:var(--r);background:var(--surface);border:1px solid var(--line);overflow:hidden;width:100%}
.plancard .cover{height:120px;background:var(--surface-2) center/cover no-repeat}
.plancard .body{padding:14px 16px;display:flex;align-items:center;gap:12px}
.plancard .types{display:flex;gap:4px;margin-top:8px}
.plancard .types i{width:18px;height:5px;border-radius:3px;background:var(--c)}
.thumb{width:44px;height:44px;border-radius:11px;background:var(--surface-2) center/cover no-repeat;flex:none}
.imgpick{display:flex;align-items:center;justify-content:center;gap:8px;border-radius:var(--r);background:var(--surface-2) center/cover no-repeat;color:var(--muted);font-weight:700;font-size:14px;cursor:pointer;position:relative;overflow:hidden}
.imgpick.cover{height:130px}
.imgpick.small{width:52px;height:52px;border-radius:13px;flex:none}
.imgpick.has{color:transparent}
.imgpick input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}
.imgrm{position:absolute;top:8px;right:8px;z-index:2}
.relative{position:relative}
.excard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:12px;min-width:0}
.exhead{display:flex;gap:10px;align-items:flex-start}
.exhead .grow{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px}
.extools{display:flex;gap:6px;flex-wrap:wrap}
.extools button{display:inline-flex;align-items:center;gap:5px;padding:6px 10px;border-radius:999px;background:var(--surface-2);font-size:12.5px;font-weight:700;color:var(--muted)}
.tools{display:flex;gap:6px;align-items:center}
.setgrid{display:grid;grid-template-columns:30px minmax(0,1fr) minmax(0,1fr) 42px 42px 26px;gap:6px;align-items:center}
.setgrid.tpl{grid-template-columns:30px minmax(0,1fr) minmax(0,1fr) 42px 30px}
.setgrid .hd{font-size:10.5px;font-weight:800;color:var(--dim);text-transform:uppercase;letter-spacing:.1em;text-align:center;display:flex;justify-content:center}
.setgrid .n{font-family:var(--display);font-weight:800;color:var(--muted);text-align:center}
.setgrid .n.w{color:var(--bike)}
.setgrid .in{min-height:42px;text-align:center;padding:6px;font-variant-numeric:tabular-nums}
.setgrid .in.dn{background:color-mix(in srgb,var(--ok) 13%,var(--bg));border-color:color-mix(in srgb,var(--ok) 35%,transparent)}
.tag{display:grid;place-items:center;height:42px;border-radius:11px;border:1px solid var(--line);font-weight:850;font-size:13px;color:var(--muted)}
.tag.w{background:var(--bike);border-color:var(--bike);color:#1a1300}
.tag.f{background:var(--gym);border-color:var(--gym);color:#fff}
.tag.d{background:var(--other);border-color:var(--other);color:#04130d}
.donebtn{display:grid;place-items:center;height:42px;border-radius:11px;background:var(--surface-2);color:var(--muted)}
.donebtn.on{background:var(--ok);color:#04130d}
.xbtn{width:30px;height:34px;border-radius:50%;display:grid;place-items:center;color:var(--dim)}
.hint{font-size:12.5px;color:var(--muted);line-height:1.45}
.hint b{color:var(--fg);font-weight:700}
.cue{font-size:13.5px;line-height:1.45;padding:10px 12px;border-radius:12px;background:color-mix(in srgb,var(--bike) 11%,transparent)}
.cue.mine{background:color-mix(in srgb,var(--accent) 10%,transparent)}
.sug{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;background:color-mix(in srgb,var(--ok) 12%,transparent);font-size:13.5px;line-height:1.35}
.sug.down{background:color-mix(in srgb,var(--warn) 14%,transparent)}
.sug .grow{flex:1;min-width:0}
.sug b{font-weight:800}
.derived{display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding:10px 12px;border-radius:12px;background:var(--surface-2);font-size:13.5px;color:var(--muted)}
.derived b{font-family:var(--display);font-size:20px;color:var(--fg);font-variant-numeric:tabular-nums;white-space:nowrap}
.ok{color:var(--ok)!important} .slow{color:var(--warn)!important} .fast{color:var(--run)!important}
.dayrow{display:flex;flex-direction:column;gap:8px;padding:12px 0;border-top:1px solid var(--line)}
.dayrow:first-child{border-top:0;padding-top:0}
.dayrow .top{display:flex;gap:8px;align-items:center}
.daynum{font-family:var(--display);font-weight:800;font-size:15px;width:58px;flex:none}
.daynum.cur{color:var(--accent)}
details.opts{border-top:1px solid var(--line);padding-top:10px}
details.opts>summary{list-style:none;cursor:pointer;font-weight:750;font-size:14px;color:var(--accent);display:flex;align-items:center;gap:6px}
details.opts>summary::-webkit-details-marker{display:none}
details.opts[open]>summary .ic{transform:rotate(90deg)}
details.opts .inner{display:flex;flex-direction:column;gap:12px;margin-top:12px}
details.opts.card{padding-top:16px;border-top:1px solid var(--line)}
.cfrow{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,.8fr) minmax(0,1fr) 30px;gap:6px;align-items:center}
.switch{display:flex;align-items:center;justify-content:space-between;gap:12px;font-weight:650;font-size:14.5px;width:100%;min-height:44px}
.switch .knob{width:46px;height:28px;border-radius:14px;background:var(--surface-2);position:relative;flex:none;transition:background .15s;border:1px solid var(--line)}
.switch .knob::after{content:"";position:absolute;top:2px;left:2px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .15s}
.switch.on .knob{background:var(--ok);border-color:var(--ok)}
.switch.on .knob::after{transform:translateX(18px)}
.ssgroup{display:flex;flex-direction:column;gap:8px;padding:10px 10px 10px 14px;border-radius:calc(var(--r) + 6px);border:1.5px solid color-mix(in srgb,var(--accent) 45%,transparent);position:relative}
.ssgroup>.eyebrow{color:var(--accent);display:flex;align-items:center;gap:6px}
.ssgroup .excard{border-color:transparent}

/* focus mode */
.fdots{display:flex;gap:5px;justify-content:center}
.fdots i{width:22px;height:4px;border-radius:2px;background:var(--surface-2)}
.fdots i.done{background:var(--ok)}
.fdots i.cur{background:var(--accent)}
.focus{display:flex;flex-direction:column;gap:14px;min-height:60vh;touch-action:pan-y}
.fhead{display:flex;flex-direction:column;gap:4px;text-align:center}
.fhead .h1{font-size:30px}
.fsets{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.fsets button{min-width:58px;padding:8px 10px;border-radius:12px;background:var(--surface-2);font-size:13px;font-weight:750;color:var(--muted);font-variant-numeric:tabular-nums;display:flex;flex-direction:column;align-items:center;line-height:1.2}
.fsets button small{font-size:10px;letter-spacing:.08em}
.fsets button.cur{outline:2px solid var(--accent);color:var(--fg)}
.fsets button.done{background:color-mix(in srgb,var(--ok) 16%,var(--surface));color:var(--fg)}
.fpanel{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stepper{display:flex;flex-direction:column;align-items:center;gap:8px;padding:14px 8px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line)}
.stepper .lab{font-size:11px;font-weight:800;letter-spacing:.14em;color:var(--muted);text-transform:uppercase}
.stepper .v{font-family:var(--display);font-size:52px;font-weight:800;letter-spacing:-.04em;line-height:1;font-stretch:85%;font-variant-numeric:tabular-nums;background:none;border:0;width:100%;text-align:center;padding:0;color:var(--fg)}
.stepper .row{display:flex;gap:10px}
.stepper .row button{width:54px;height:46px;border-radius:14px;background:var(--surface-2);font-size:24px;font-weight:700;display:grid;place-items:center}
.fnav{display:flex;gap:10px}
.fnav .btn{flex:1}

/* plates */
.platesvg{width:100%;height:auto;display:block}
.plist{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.plist span{padding:4px 10px;border-radius:999px;font-weight:800;font-size:13px;background:var(--c);color:#0b0c0e}

/* structured workouts */
.profile{border-radius:14px;background:var(--bg);padding:12px 12px 8px;display:flex;flex-direction:column;gap:6px}
.profile svg{width:100%;height:auto;display:block}
.psum{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);font-weight:650}
.psum b{color:var(--fg);font-family:var(--display);font-size:16px}
.step{display:flex;flex-direction:column;gap:8px;padding:10px;border-radius:14px;background:var(--bg)}
.steptop{display:flex;align-items:center;gap:8px}
.steptop select{flex:1;min-width:0}
.kdot{width:12px;height:12px;border-radius:4px;flex:none;background:var(--k)}
.repeat{display:flex;flex-direction:column;gap:8px;padding:10px;border-radius:16px;border:1.5px dashed color-mix(in srgb,var(--c) 50%,transparent)}
.repeat>.steptop b{font-family:var(--display);font-size:16px}
.repeat .step{background:var(--surface-2)}
.presets{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px}
.split{display:grid;grid-template-columns:12px minmax(0,1fr) 92px 60px;gap:8px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.split:first-child{border-top:0}
.split .lab b{display:block;font-size:14px}
.split .lab span{display:block;font-size:12px;color:var(--muted)}
.split .in{min-height:38px;text-align:center;padding:6px;font-variant-numeric:tabular-nums}
.split .spd{text-align:right;font-family:var(--display);font-weight:800;font-size:15px;font-variant-numeric:tabular-nums}
.split.rec .lab b,.split.warm .lab b,.split.cool .lab b{font-weight:600;color:var(--muted)}

/* history & calendar */
.monthhead{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-top:10px;flex-wrap:wrap}
.monthhead .month{font-family:var(--display);font-weight:800;font-size:20px;letter-spacing:-.02em}
.monthhead span{font-size:12.5px;color:var(--muted);font-weight:650;font-variant-numeric:tabular-nums}
.wsum{border-radius:var(--r);padding:14px 16px;border:1px dashed var(--line);display:flex;flex-direction:column;gap:6px;font-size:13.5px}
.wsum .top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.wsum .score{font-family:var(--display);font-weight:800;font-size:22px;font-variant-numeric:tabular-nums}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin:0}
.kv dt{color:var(--muted)} .kv dd{margin:0;font-weight:650}
.setlist{display:grid;grid-template-columns:auto 1fr auto;gap:6px 14px;font-variant-numeric:tabular-nums;font-size:15px}
.setlist .n{color:var(--muted);font-weight:750}
.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:10px}
.metric{display:flex;flex-direction:column;min-width:0}
.metric span{font-size:11.5px;color:var(--muted);font-weight:650}
.metric b{font-family:var(--display);font-size:22px;font-weight:800;font-variant-numeric:tabular-nums;overflow-wrap:anywhere;font-stretch:85%;letter-spacing:-.02em}
.calnav{display:flex;align-items:center;justify-content:space-between;gap:8px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .hd{font-size:10.5px;font-weight:800;color:var(--dim);text-align:center;padding-bottom:2px}
.cday{aspect-ratio:1/1.08;max-width:100%;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-family:var(--display);font-weight:750;font-size:15px;font-variant-numeric:tabular-nums}
.cday.has{background:var(--surface-2)}
.cday.today{outline:2px solid var(--accent);outline-offset:-2px}
.cday.sel{background:var(--fg);color:var(--bg)}
.cday.out{opacity:.3}
.cday .wdots i{width:6px;height:6px}
.srcb{font-size:10px;font-weight:850;text-transform:uppercase;letter-spacing:.06em;padding:2px 6px;border-radius:5px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.prb{font-size:10px;font-weight:850;text-transform:uppercase;letter-spacing:.06em;padding:2px 6px;border-radius:5px;background:var(--bike);color:#1a1300;white-space:nowrap}
.search{display:flex;gap:8px;align-items:center}
.search .in{flex:1}
.hscroll{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.hscroll::-webkit-scrollbar{display:none}

/* stats */
.chart{width:100%;height:auto;display:block;overflow:visible}
.chart .gl{stroke:var(--line);stroke-width:1}
.ax{fill:var(--dim);font-size:10.5px;font-family:var(--body);font-variant-numeric:tabular-nums}
.chart .tgt{stroke:var(--fg);stroke-width:1.2;stroke-dasharray:4 4;opacity:.5}
.chart .lbl{fill:var(--fg);font-size:11.5px;font-weight:750;font-family:var(--body)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;background:var(--c)}
.empty{color:var(--muted);font-size:14px;padding:6px 0}
.chead{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.chead .v{font-family:var(--display);font-weight:800;font-size:18px;font-variant-numeric:tabular-nums}
.hbars{display:flex;flex-direction:column;gap:8px}
.hbar{display:grid;grid-template-columns:96px minmax(0,1fr) 52px;gap:10px;align-items:center;font-size:13px}
.hbar span:first-child{font-weight:650;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hbar .tr{height:10px;border-radius:5px;background:var(--surface-2);overflow:hidden}
.hbar .tr i{display:block;height:100%;border-radius:5px;background:var(--c,var(--accent))}
.hbar b{font-family:var(--display);text-align:right;font-variant-numeric:tabular-nums}
.heat{width:100%;height:auto;display:block}
.best{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.cmp{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
.cmp th{font-size:10.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);text-align:right;padding:4px 0 8px}
.cmp th:first-child,.cmp td:first-child{text-align:left}
.cmp td{padding:8px 0;border-top:1px solid var(--line);text-align:right}
.cmp td:first-child{color:var(--muted);font-weight:650}
.cmp .up{color:var(--ok);font-weight:750} .cmp .dn{color:var(--bad);font-weight:750}
.tablewrap{overflow-x:auto}

/* PRs, achievements */
.prrow{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:13px 14px;border-top:1px solid var(--line);width:100%;align-items:center}
.prrow:first-child{border-top:0}
.prrow .v{font-family:var(--display);font-weight:800;font-size:20px;font-variant-numeric:tabular-nums;text-align:right;font-stretch:85%}
.prrow .v.none{color:var(--dim);font-weight:650;font-size:16px}
.prrow .d{font-size:12px;color:var(--muted);grid-column:1/-1}
.prgroup{padding:12px 14px 4px;font-family:var(--display);font-weight:800;font-size:16px;display:flex;align-items:center;gap:8px}
.src{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;padding:2px 6px;border-radius:5px;background:var(--surface-2);color:var(--muted)}
.rcard{flex:0 0 auto;width:150px;display:flex;flex-direction:column;gap:4px;padding:12px;border-radius:16px;background:var(--surface);border:1px solid var(--line);text-align:left}
.rcard b{font-family:var(--display);font-size:22px;font-weight:800;font-stretch:85%;letter-spacing:-.02em}
.rcard span{font-size:12px;color:var(--muted);line-height:1.3}
.achs{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:10px}
.ach{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;padding:12px 6px;border-radius:16px;background:var(--surface);border:1px solid var(--line)}
.ach .medal{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;background:color-mix(in srgb,var(--c,var(--accent)) 18%,transparent);color:var(--c,var(--accent));box-shadow:0 0 calc(var(--glow)*18px) color-mix(in srgb,var(--c,var(--accent)) 35%,transparent)}
.ach.locked{opacity:.38}
.ach.locked .medal{background:var(--surface-2);color:var(--dim);box-shadow:none}
.ach b{font-size:12.5px;line-height:1.2}
.ach span{font-size:11px;color:var(--muted);line-height:1.25}
.swatches{display:flex;gap:10px;flex-wrap:wrap}
.swatch{width:40px;height:40px;border-radius:50%;background:var(--c);display:grid;place-items:center;color:#fff;border:3px solid transparent}
.swatch.on{border-color:var(--fg)}

/* summary */
.sumhero{display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;padding:18px 16px}
.sumhero .h1{font-size:30px}
.delta{font-size:12.5px;font-weight:800}
.delta.up{color:var(--ok)} .delta.dn{color:var(--bad)}
.shareimg{width:100%;border-radius:18px;border:1px solid var(--line)}
.wkpanel .racebig{font-size:48px}

/* sheet, toast, rest timer */
#sheet{position:fixed;inset:0;z-index:20}
.sheet-bg{position:absolute;inset:0;background:rgba(0,0,0,.55);animation:fade .18s}
.sheet-panel{position:absolute;left:0;right:0;bottom:0;max-height:88vh;overflow-y:auto;-webkit-overflow-scrolling:touch;background:var(--bg);border-top:1px solid var(--line);border-radius:24px 24px 0 0;padding:8px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px;animation:up .22s cubic-bezier(.2,.8,.2,1);max-width:640px;margin:0 auto}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);align-self:center;margin-bottom:2px}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
@keyframes fade{from{opacity:0}}
@media (prefers-reduced-motion:reduce){.sheet-panel,.sheet-bg{animation:none}}
.opt{display:flex;align-items:center;gap:12px;padding:12px 14px;border-top:1px solid var(--line);width:100%}
.opt:first-child{border-top:0}
.opt .grow{flex:1;min-width:0}
.radio{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);flex:none;display:grid;place-items:center}
.radio.on{border-color:var(--accent);background:var(--accent);color:var(--on-accent)}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--fg);color:var(--bg);padding:10px 12px 10px 18px;border-radius:999px;font-weight:700;font-size:14px;box-shadow:0 6px 24px rgba(0,0,0,.3);max-width:calc(100% - 32px);display:flex;align-items:center;gap:12px;text-align:left}
#toast button{padding:6px 12px;border-radius:999px;background:var(--accent);color:var(--on-accent);font-weight:800;font-size:13px;letter-spacing:.04em;text-transform:uppercase}
#restbar{position:fixed;left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:9;max-width:576px;margin:0 auto;background:var(--surface);border:1px solid var(--line);color:var(--fg);border-radius:20px;padding:10px 10px 10px 16px;display:flex;align-items:center;gap:10px;box-shadow:0 10px 30px rgba(0,0,0,.35);overflow:hidden}
#restbar .rt{font-family:var(--display);font-weight:800;font-size:28px;font-variant-numeric:tabular-nums;min-width:72px;font-stretch:85%}
#restbar .rl{flex:1;min-width:0;font-size:12.5px;color:var(--muted);line-height:1.25;overflow:hidden;text-overflow:ellipsis}
#restbar button{min-height:38px;padding:0 10px;border-radius:11px;background:var(--surface-2);font-weight:800;font-size:14px}
#restbar .prog{position:absolute;left:0;bottom:0;height:3px;background:var(--accent)}
#restbar.done{background:var(--ok);color:#04130d;border-color:var(--ok)}
#restbar.done .rl{color:inherit}
.prwin{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;padding:10px 0}
.prwin .medal{width:72px;height:72px;border-radius:50%;display:grid;place-items:center;background:var(--bike);color:#1a1300}
.copybox{font-family:var(--mono);font-size:12px;height:140px}
.codebox{font-family:var(--mono);font-size:18px;font-weight:700;padding:14px;border-radius:14px;background:var(--surface-2);text-align:center;overflow-wrap:anywhere}
.sessionhead{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.timer{font-family:var(--display);font-weight:800;font-size:18px;font-variant-numeric:tabular-nums;font-stretch:85%}
.imgview{width:100%;border-radius:14px}
.adhoc{display:flex;flex-direction:column;gap:10px;padding:14px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line)}
.status{display:flex;align-items:center;gap:8px;font-weight:700;font-size:14px}
.status i{width:10px;height:10px;border-radius:50%;background:var(--c,var(--muted));box-shadow:0 0 calc(var(--glow)*8px) var(--c,transparent)}
.widgetrow{display:flex;align-items:center;gap:10px;padding:10px 14px;border-top:1px solid var(--line)}
.widgetrow:first-child{border-top:0}
.widgetrow .grow{flex:1;min-width:0;font-weight:650}

/* ===== v4: sleeker, thinner, premium. Pure black, hairlines, light numerals, tracked labels. ===== */
:root{--display:"SF Pro Display",-apple-system,BlinkMacSystemFont,"Helvetica Neue",system-ui,Roboto,sans-serif;--body:"SF Pro Text",-apple-system,BlinkMacSystemFont,"Helvetica Neue",system-ui,Roboto,sans-serif;--r:20px}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#000;--surface:#0B0C0F;--surface-2:#15171C;--line:#1B1E24;--muted:#8A909B;--dim:#4F5560}}
:root[data-theme="dark"]{--bg:#000;--surface:#0B0C0F;--surface-2:#15171C;--line:#1B1E24;--muted:#8A909B;--dim:#4F5560}
body{letter-spacing:-.005em}
.ic{stroke-width:1.6}
.h1{font-weight:600;letter-spacing:-.03em;font-size:32px}
.h2{font-weight:600;letter-spacing:-.02em}
.h3{font-weight:600}
.eyebrow{font-weight:600;font-size:10.5px;letter-spacing:.18em}
.sec .h2{font-weight:600;font-size:10.5px;letter-spacing:.18em}
.brand{font-weight:600;letter-spacing:-.045em;font-size:19px}
.card,.list,.excard,.tile,.plancard,.feat,.adhoc,.rcard,.ach,.stepper{border-color:var(--line)}
.card,.list,.excard,.plancard,.feat{border-radius:var(--r)}

.feat-num.long{font-size:60px}
.tile b{font-size:27px}
.tile b small,.feat-unit{font-weight:500}
.pc-title{font-size:28px;font-weight:300}
.rbig .ring b span{font-size:44px;font-weight:200}

.rbig .ring{width:136px;height:136px}

.ring b{font-weight:400}

.seg{background:var(--surface);border:1px solid var(--line)}

.seg button.on{background:var(--surface-2);box-shadow:none;font-weight:600}
.in{background:var(--surface-2);border-color:transparent}
.in:focus{border-color:var(--accent);background:var(--surface-2)}
.li .t,.wtile b{font-weight:550}
.field>span{font-weight:600;letter-spacing:.04em;text-transform:uppercase;font-size:10.5px}
.tchip{font-weight:550}
.pill{font-weight:600}
.lt{font-weight:500}
.setgrid .hd{font-weight:600;letter-spacing:.16em}
.setgrid .n{font-weight:500}
.hint{font-size:12.5px}
.tiles{gap:8px}
.metric span,.tile span{font-weight:500}
#tabs{background:color-mix(in srgb,var(--bg) 80%,transparent)}
.ready::before{opacity:.8}
.rbig .ring circle{stroke-width:5}
.ring .prog{filter:drop-shadow(0 0 calc(var(--glow)*8px) currentColor)}
.feat{background:linear-gradient(160deg,color-mix(in srgb,var(--accent) calc(var(--glow)*9%),var(--surface)),var(--surface) 60%)}
.feat svg.viz{opacity:.9}
.live{background:var(--surface-2);color:var(--fg);border:1px solid color-mix(in srgb,var(--accent) 50%,transparent)}
.live .pulse{color:var(--accent)}
.cue.warn{background:color-mix(in srgb,var(--bad) 13%,transparent)}
.bar{height:5px;border-radius:3px;background:var(--surface-2);overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;border-radius:3px;background:var(--accent);box-shadow:0 0 calc(var(--glow)*10px) var(--accent)}
.dimc{opacity:.55}
.extools button.hot{background:var(--accent);color:var(--on-accent)}
/* set rows */
.setgrid{display:flex;flex-direction:column;gap:6px}
.srow{display:grid;grid-template-columns:30px minmax(0,1fr) minmax(0,1fr) 42px 42px 26px;gap:6px;align-items:center;position:relative;transition:transform .18s;border-radius:12px;touch-action:pan-y}
.srow.hdrow{touch-action:auto}
.srow.swr{box-shadow:-8px 0 0 0 var(--ok)} .srow.swl{box-shadow:8px 0 0 0 var(--bad)}
.setgrid.tpl{display:grid}
.donebtn.pop{animation:pop .45s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{0%{transform:scale(.6)}60%{transform:scale(1.18)}100%{transform:scale(1)}}
body.anim .ring .prog{animation:draw 1.1s cubic-bezier(.2,.8,.2,1) both}
@keyframes draw{from{stroke-dashoffset:var(--p,0)}to{stroke-dashoffset:0}}
@media (prefers-reduced-motion:reduce){body.anim .ring .prog,.donebtn.pop{animation:none}}
/* sortable */
.sortable{display:flex;flex-direction:column;gap:12px}
.wwrap{display:flex;flex-direction:column;gap:12px;transition:transform .15s}
.lifting{transform:scale(1.02);opacity:.92;filter:drop-shadow(0 18px 30px rgba(0,0,0,.5));z-index:3;position:relative}
.grip{color:var(--dim);display:grid;place-items:center;width:22px;height:52px;touch-action:none;cursor:grab;flex:none}
[data-sortable="ex"]{display:flex;flex-direction:column;gap:12px}
/* pull to refresh */
#ptr{height:0;overflow:hidden;display:grid;place-items:center;color:var(--muted);transition:height .2s;margin:-6px 0}
#ptr.go{color:var(--accent)}
#ptr.go .ic{transform:rotate(180deg)}
/* onboarding & planner */
.obq{display:flex;flex-direction:column;gap:6px;margin:10px 0 4px}
.obdays{display:grid;grid-template-columns:repeat(auto-fit,minmax(56px,1fr));gap:8px}
.obdays button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:14px 4px;border-radius:16px;background:var(--surface);border:1px solid var(--line)}
.obdays button b{font-family:var(--display);font-weight:300;font-size:30px;letter-spacing:-.03em}
.obdays button span{font-size:11px;color:var(--muted);font-weight:500}
.obdays button.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,var(--surface))}
.planner{display:flex;flex-direction:column;gap:6px}
.pday{display:grid;grid-template-columns:56px 1fr;gap:10px;align-items:center;padding:10px 12px;border-radius:16px;background:var(--surface);border:1px solid var(--line)}
.pday.today{border-color:color-mix(in srgb,var(--accent) 55%,transparent)}
.pdh{display:flex;flex-direction:column;line-height:1.1}
.pdh b{font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.pdh span{font-family:var(--display);font-weight:300;font-size:24px}
.pday.today .pdh span{color:var(--accent)}
.pdc{display:flex;flex-wrap:wrap;gap:6px;min-width:0}
.pchip{display:inline-flex;align-items:center;gap:5px;padding:6px 10px;border-radius:999px;font-size:13px;font-weight:550;background:color-mix(in srgb,var(--c,var(--muted)) 14%,transparent);color:var(--fg);max-width:100%}
.pchip .ic{color:var(--c)}
.pchip.ok,.pchip.done{opacity:.6}
.pchip.add{background:transparent;border:1px dashed var(--line);color:var(--muted);padding:6px 9px}
.libcard .chips{gap:6px}
/* players */
.player{display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center;padding:8px 0}
.livebig{font-family:var(--display);font-weight:200;font-size:96px;line-height:1;letter-spacing:-.05em}
.livetgt{padding:10px 16px;border-radius:14px;background:var(--surface);border:1px solid var(--line);font-size:15px}
.livetgt b{font-weight:600}
.ring.huge{width:220px;height:220px}
.ring.huge b span{font-family:var(--display);font-weight:200;font-size:56px;letter-spacing:-.04em}
/* tempo */
.tempo{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line)}
.tbar{width:64px;height:160px;border-radius:32px;background:var(--surface-2);position:relative;overflow:hidden;margin:10px 0}
.tbar i{position:absolute;left:0;right:0;bottom:0;height:100%;background:var(--accent);border-radius:32px;box-shadow:0 0 calc(var(--glow)*18px) var(--accent);transition:height .06s linear}
.tphases{display:flex;gap:12px;font-size:12.5px;color:var(--muted)}
.tphases b{color:var(--fg);font-weight:600}
/* volume */
.vol{display:flex;flex-direction:column;gap:9px}
.vrow{display:grid;grid-template-columns:84px minmax(0,1fr) 40px;gap:10px;align-items:center;font-size:13px}
.vrow>span:first-child{font-weight:550}
.vtr{position:relative;height:10px;border-radius:5px;background:var(--surface-2)}
.vtr .band{position:absolute;left:40%;width:40%;top:0;bottom:0;background:color-mix(in srgb,var(--ok) 22%,transparent);border-radius:3px}
.vtr .mk{position:absolute;top:-3px;width:4px;height:16px;border-radius:2px;background:var(--fg);transform:translateX(-50%)}
.vrow.lo .mk{background:var(--warn)} .vrow.hi .mk{background:var(--bad)} .vrow.ok .mk{background:var(--ok)}
.vrow b{font-family:var(--display);font-weight:400;text-align:right;font-variant-numeric:tabular-nums}
/* journal & year */
.jimg{width:100%;border-radius:14px;max-height:420px;object-fit:cover}
.jfig{margin:0;display:flex;flex-direction:column;gap:6px}
.jfig img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:14px}
.jfig figcaption{font-size:12px;color:var(--muted)}
.yearhero{align-items:center;text-align:center;padding:26px 16px;background:radial-gradient(ellipse at top,color-mix(in srgb,var(--accent) calc(var(--glow)*22%),var(--surface)),var(--surface) 70%)}
.yearhero .racebig{font-size:110px;font-weight:200}
.tourb{border-style:solid;border-color:color-mix(in srgb,var(--accent) 40%,transparent)}
/* tour overlay */
#tour{position:fixed;inset:0;z-index:40;pointer-events:none}
#tour .tb{position:fixed;background:rgba(0,0,0,.62);pointer-events:auto}
#tour .tb.clear{background:transparent}
#tour .thole{position:fixed;border-radius:16px;box-shadow:0 0 0 2px var(--accent),0 0 24px 4px color-mix(in srgb,var(--accent) 50%,transparent);pointer-events:none;transition:all .25s}
#tour .tcard{position:fixed;left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));max-width:420px;margin:0 auto;background:var(--surface-2);border:1px solid var(--line);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:6px;pointer-events:auto;box-shadow:0 20px 50px rgba(0,0,0,.6);animation:up .25s}
#tour .tcard b{font-family:var(--display);font-size:19px;font-weight:600;letter-spacing:-.02em}
#tour .tcard p{font-size:14.5px;color:var(--muted);line-height:1.45}
#tour .tcard .btnrow{margin-top:6px}
.cue .ic{display:inline-block;vertical-align:-3px;margin-right:4px}
/* v4.1 fixes */
html,body{overflow-x:clip;max-width:100%}
#app{overflow-x:clip}
.feat{clip-path:inset(0 round var(--r));isolation:isolate}
.feat .plate{right:-30px;top:-30px;width:150px;height:150px}
.ring b{display:flex!important;flex-direction:column;align-items:center;justify-content:center;gap:4px;text-align:center;line-height:1}
.rbig .ring b span{line-height:.9;margin-top:4px}
.rbig .ring b small{margin-top:0}
.feat-num{font-weight:250}
.dq{display:flex;flex-direction:column;gap:8px;padding:12px 0;border-top:1px solid var(--line)}
.dqh{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.dqh b{font-weight:600;font-size:15px}
.dq .ckc button{min-height:44px;font-size:16px;font-weight:500}
.ckc button{text-align:center;display:grid;place-items:center}
/* v4.2: solid top bar, large-title behaviour */
.topbar{background:var(--bg);-webkit-backdrop-filter:none;backdrop-filter:none;border-bottom:1px solid transparent;transition:border-color .2s}
body.scrolled .topbar{border-bottom-color:var(--line)}
#app.hasbig .tb-title{opacity:0;transform:translateY(6px);transition:opacity .2s,transform .2s}
body.scrolled #app.hasbig .tb-title{opacity:1;transform:none}

/* ================= v5 Glass · aurora ================= */
:root,:root[data-theme="dark"],:root:not([data-theme="light"]){color-scheme:dark;--bg:#0A0820;--fg:#F5F3FF;--surface:rgba(255,255,255,.065);--surface-2:rgba(255,255,255,.10);--line:rgba(255,255,255,.12);--muted:rgba(240,236,255,.64);--dim:rgba(240,236,255,.40);
 --accent:#FF5D8F;--accent2:#A46BFF;--on-accent:#fff;--strain:#5CE1E6;--ok:#4ADE9B;--warn:#FFC05C;--bad:#FF6B6B;--gym:#FF5D8F;--run:#5CE1E6;--bike:#A46BFF;--other:#FFC05C;--glow:1;--r:26px;
 --glass:blur(22px) saturate(160%);--ease:cubic-bezier(.2,.8,.2,1);--spring:cubic-bezier(.34,1.56,.64,1)}
html{background:#05040f}
body{background:transparent;color:var(--fg);--mood:#8B5CFF}
body::before{content:"";position:fixed;inset:-10vh -10vw;z-index:-2;pointer-events:none;background:
 radial-gradient(60vmax 50vmax at 85% -5%,color-mix(in srgb,var(--mood) 38%,transparent),transparent 70%),
 radial-gradient(55vmax 45vmax at -10% 30%,rgba(58,29,122,.55),transparent 70%),
 radial-gradient(50vmax 40vmax at 110% 85%,rgba(92,225,230,.10),transparent 70%),
 linear-gradient(160deg,#1b1240,#07101f 55%,#000);transition:background 1.2s}
body::after{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:.05;background-image:radial-gradient(rgba(255,255,255,.9) .5px,transparent .6px);background-size:3px 3px}
.card,.tile,.feat,.li:first-child,.list,.banner,.wchip,.stepper,.seg,.rcard,.extools button,.qbtn{-webkit-backdrop-filter:var(--glass);backdrop-filter:var(--glass)}
.card,.feat,.list{background:var(--surface);border:1px solid var(--line);box-shadow:inset 0 1px 0 rgba(255,255,255,.06),0 10px 40px rgba(0,0,0,.25)}
.list{border-radius:var(--r);overflow:hidden}
.list .li{border-top-color:rgba(255,255,255,.07)}.list>.li:first-child,.list>*:first-child .li{border-top:0}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:20px}
.feat{background:linear-gradient(150deg,color-mix(in srgb,var(--accent) 22%,transparent),color-mix(in srgb,var(--accent2) 14%,transparent) 45%,var(--surface) 80%)}
.feat-num{background:linear-gradient(120deg,#fff 20%,color-mix(in srgb,var(--accent) 55%,#fff));-webkit-background-clip:text;background-clip:text;color:transparent}
.btn.primary{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border:0;box-shadow:0 8px 28px color-mix(in srgb,var(--accent) 35%,transparent),inset 0 1px 0 rgba(255,255,255,.25)}
.btn.primary:active{transform:scale(.97)}
.btn,.iconbtn{transition:transform .18s var(--ease),background .2s,opacity .2s}
.btn:active,.iconbtn:active,.li:active,.tab:active,.qbtn:active,.wchip:active,.opt:active{transform:scale(.97)}
.btn.line,.btn:not(.primary):not(.ghost):not(.danger){background:var(--surface-2);border-color:var(--line)}
.iconbtn{background:var(--surface-2);border:1px solid var(--line)}
.live{background:linear-gradient(135deg,color-mix(in srgb,var(--accent) 30%,transparent),color-mix(in srgb,var(--accent2) 25%,transparent));border:1px solid color-mix(in srgb,var(--accent) 45%,transparent);-webkit-backdrop-filter:var(--glass);backdrop-filter:var(--glass)}
.banner{background:rgba(255,255,255,.05);border-color:color-mix(in srgb,var(--accent) 40%,transparent)}
.seg{background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:14px;padding:3px}
.seg button{border-radius:11px;transition:background .25s var(--ease),color .2s}
.seg button.on{background:rgba(255,255,255,.16);color:#fff;box-shadow:0 2px 10px rgba(0,0,0,.25)}
.eyebrow{color:color-mix(in srgb,var(--accent) 70%,#fff)}
.in,select.in,textarea.in{background:rgba(255,255,255,.06);border-color:var(--line);color:var(--fg)}
.in:focus{border-color:color-mix(in srgb,var(--accent) 70%,transparent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 22%,transparent)}
.switch.on .knob,.switch.on{--k:var(--accent)}
.topbar,:root .topbar{background:rgba(9,7,26,.55);-webkit-backdrop-filter:var(--glass);backdrop-filter:var(--glass)}
body.scrolled .topbar{border-bottom-color:var(--line)}
#tabs,:root #tabs{background:rgba(10,8,28,.62);-webkit-backdrop-filter:var(--glass);backdrop-filter:var(--glass);border-top:1px solid var(--line)}
.tab{transition:color .2s}.tab .ic{transition:transform .35s var(--spring)}
.tab.on{color:#fff}.tab.on .ic{color:var(--accent);filter:drop-shadow(0 0 8px color-mix(in srgb,var(--accent) 60%,transparent))}
.tab.bump .ic{animation:bump .45s var(--spring)}
@keyframes bump{0%{transform:scale(1)}40%{transform:scale(1.22) translateY(-2px)}100%{transform:scale(1)}}
#sheet .sheet-bg,#sheet>.bg{background:rgba(3,2,12,.55);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
.sheet-panel{background:rgba(22,16,52,.82);-webkit-backdrop-filter:blur(30px) saturate(170%);backdrop-filter:blur(30px) saturate(170%);border-top:1px solid rgba(255,255,255,.16);animation:sheetIn .38s var(--ease)}
@keyframes sheetIn{from{transform:translateY(100%)}to{transform:none}}
#toast{background:rgba(30,22,64,.9);color:#fff;border:1px solid var(--line);-webkit-backdrop-filter:var(--glass);backdrop-filter:var(--glass);animation:toastIn .35s var(--spring)}
@keyframes toastIn{from{transform:translate(-50%,24px);opacity:0}to{transform:translate(-50%,0);opacity:1}}
.brand svg{border-radius:9px;box-shadow:0 4px 18px rgba(164,107,255,.35)}
.brand i{color:var(--accent);font-style:normal}

/* transitions */
#app.nav-push{animation:pushIn .34s var(--ease)}
#app.nav-pop{animation:popIn .3s var(--ease)}
#app.nav-tab{animation:fadeUp .32s var(--ease)}
@keyframes pushIn{from{transform:translateX(28%);opacity:0}to{transform:none;opacity:1}}
@keyframes popIn{from{transform:translateX(-18%);opacity:0}to{transform:none;opacity:1}}
@keyframes fadeUp{from{transform:translateY(10px);opacity:0}to{transform:none;opacity:1}}
body.anim .sortable>.wwrap{animation:fadeUp .45s var(--ease) both}
body.anim .sortable>.wwrap:nth-child(2){animation-delay:.04s}body.anim .sortable>.wwrap:nth-child(3){animation-delay:.08s}body.anim .sortable>.wwrap:nth-child(4){animation-delay:.12s}body.anim .sortable>.wwrap:nth-child(5){animation-delay:.16s}body.anim .sortable>.wwrap:nth-child(6){animation-delay:.2s}body.anim .sortable>.wwrap:nth-child(n+7){animation-delay:.24s}
.ring circle,.ring path{transition:stroke-dasharray .8s var(--ease)}
html.calm *,html.calm *::before,html.calm *::after{animation:none!important;transition:none!important}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
html.bigtext{font-size:112%}html.bigtext body{zoom:1.1}
html.solid{--surface:#17122F;--surface-2:#221B42;--line:rgba(255,255,255,.18);--muted:rgba(245,243,255,.78)}
html.solid .card,html.solid .tile,html.solid .list,html.solid .feat{-webkit-backdrop-filter:none;backdrop-filter:none}

/* compact widgets */
.wwrap.compact .card,.wwrap.compact .feat{padding:12px 14px;gap:8px}
.wwrap.compact .feat-num{font-size:44px}
.wwrap.compact .hint,.wwrap.compact .muted.sm,.wwrap.compact .legend{display:none}
.wwrap.compact .ring{transform:scale(.82);transform-origin:center}
.wwrap.compact .btn.xl{min-height:50px;font-size:16px}

/* header sync chip */
.hdr .tools{display:flex;align-items:center;gap:8px}
.chipsync{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:999px;font-size:11.5px;font-weight:600;color:var(--muted);background:rgba(255,255,255,.06);border:1px solid var(--line)}
.chipsync i{width:7px;height:7px;border-radius:50%;background:var(--c);box-shadow:0 0 8px var(--c)}
.chipsync i.spin{animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.3}}

/* month widget */
.monthw{text-align:left}
.mrow{display:flex;gap:16px;align-items:center}
.mgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;flex:1;min-width:0;max-width:190px}
.mgrid i{aspect-ratio:1;border-radius:4px;background:rgba(255,255,255,.07)}
.mgrid i.out{opacity:0}.mgrid i.fut{background:rgba(255,255,255,.03)}
.mgrid i[data-on="1"]{background:var(--c,var(--accent));box-shadow:0 0 6px color-mix(in srgb,var(--c,var(--accent)) 60%,transparent)}
.mgrid i.td{outline:1.5px solid #fff;outline-offset:1px}
.mstats{display:flex;flex-direction:column;gap:8px;flex:0 0 auto}
.mstats div{display:flex;flex-direction:column}.mstats b{font-family:var(--display);font-size:22px;font-weight:300;letter-spacing:-.03em;line-height:1}.mstats b small{font-size:12px;color:var(--muted);margin-left:2px}
.mstats span{font-size:11px;color:var(--muted)}
.wwrap.compact .mstats{flex-direction:row;gap:14px}.wwrap.compact .mrow{flex-direction:column;align-items:stretch}.wwrap.compact .mgrid{display:none}

/* FAB */
#fab{position:fixed;right:max(18px,env(safe-area-inset-right,0px));bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:12}
.fabbtn{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;color:#fff;background:linear-gradient(135deg,var(--accent),var(--accent2));box-shadow:0 10px 30px color-mix(in srgb,var(--accent) 45%,transparent),inset 0 1px 0 rgba(255,255,255,.3);transition:transform .3s var(--spring);animation:fabIn .4s var(--spring);touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.fabbtn:active{transform:scale(.92)}.fabbtn.open{transform:rotate(45deg)}
@keyframes fabIn{from{transform:scale(.3);opacity:0}to{transform:none;opacity:1}}
.fanbg{position:fixed;inset:0;background:rgba(3,2,12,.5);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);animation:fade .2s}
@keyframes fade{from{opacity:0}}

<script>
'use strict';
/* ================= utilities ================= */
const $=s=>document.querySelector(s);
const uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-4);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm=s=>String(s||'').trim().toLowerCase().replace(/\s+/g,' ');
const num=v=>{if(v===''||v==null)return '';const n=parseFloat(String(v).replace(',','.'));return isFinite(n)?n:''};
const DAY=864e5;
const p2=n=>String(n).padStart(2,'0');
const clone=o=>JSON.parse(JSON.stringify(o));
function sod(t){const d=new Date(t);d.setHours(0,0,0,0);return d.getTime()}
function ymd(t){const d=new Date(t);return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate())}
function weekStart(t){const d=new Date(sod(t));d.setDate(d.getDate()-(d.getDay()+6)%7);return d.getTime()}
function addDays(t,n){const d=new Date(t);d.setDate(d.getDate()+n);return d.getTime()}
function monthStart(t){const d=new Date(t);return new Date(d.getFullYear(),d.getMonth(),1).getTime()}
function addMonths(t,n){const d=new Date(t);return new Date(d.getFullYear(),d.getMonth()+n,1).getTime()}
function fmtDate(t,o){return new Date(t).toLocaleDateString('en-GB',o||{day:'numeric',month:'short'})}
function fmtDateY(t){return fmtDate(t,{day:'numeric',month:'short',year:'numeric'})}
function dtLocal(t){const d=new Date(t);return ymd(t)+'T'+p2(d.getHours())+':'+p2(d.getMinutes())}
function fmtDur(sec){if(sec===''||sec==null||!isFinite(sec))return '';sec=Math.round(sec);const h=Math.floor(sec/3600),m=Math.floor(sec%3600/60),s=sec%60;return h?`${h}:${p2(m)}:${p2(s)}`:`${m}:${p2(s)}`}
function fmtHM(sec){sec=Math.round(sec||0);const h=Math.floor(sec/3600),m=Math.round(sec%3600/60);return h?`${h}h ${p2(m)}m`:`${m} min`}
function parseDur(str){str=String(str??'').trim();if(!str)return '';const parts=str.split(':');if(parts.some(x=>x.trim()===''||isNaN(x.replace(',','.'))))return '';const n=parts.map(x=>parseFloat(x.replace(',','.')));if(n.length===1)return Math.round(n[0]*60);if(n.length===2)return Math.round(n[0]*60+n[1]);return Math.round(n[0]*3600+n[1]*60+n[2])}

const plain=(v,d=2)=>v===''||v==null||!isFinite(v)?'':String(Math.round(v*Math.pow(10,d))/Math.pow(10,d));

const plural=(n,w,p)=>`${n} ${n===1?w:(p||(/[^aeiou]y$/.test(w)?w.slice(0,-1)+'ies':w+'s'))}`;

/* ================= types ================= */
const CAT={gym:'Gym',run:'Running',bike:'Cycling',other:'Other'};
const typeLabel1=o=>o.type==='custom'?(o.customName||'Custom'):(CAT[o.type]||'Other');

function stepEst(s,cat){const v=num(s.v)||0;
 if(cat==='bike'){const m=String(s.tgt||'').match(/(\d+(?:[.,]\d+)?)\s*km\/?h/i);const kmh=m?num(m[1]):({warm:24,work:31,rec:20,cool:23}[s.kind]||26);if(s.by==='dist'){const km=v/1000;return{km,sec:km/kmh*3600}}return{km:v/3600*kmh,sec:v}}
 const pr=parsePace(s.tgt);const pace=pr?(pr[0]+pr[1])/2:({warm:390,work:300,rec:480,cool:390}[s.kind]||360);
 if(s.by==='dist'){const km=v/1000;return{km,sec:km*pace}}return{km:v/pace,sec:v}}
function intensity(s,cat){if(cat==='run'){const pr=parsePace(s.tgt);if(pr){const p=(pr[0]+pr[1])/2;return Math.max(.12,Math.min(1,(480-p)/(480-210)))}}
 if(cat==='bike'){const z=String(s.tgt||'').match(/zone\s*(\d)/i);if(z)return Math.min(1,.12+.17*(+z[1]))}
 return{warm:.35,work:.82,rec:.16,cool:.3}[s.kind]||.4}

function profileSVG(steps,cat){const fl=flatSteps(steps);if(!fl.length)return '<p class="hint">Add steps or pick a template to see the workout shape.</p>';

 fl.forEach((s,i)=>{const w=est[i]/tot*W;const h=Math.max(6,intensity(s,cat)*(H-4));r+=`<rect x="${(x+.75).toFixed(1)}" y="${(H-h).toFixed(1)}" width="${Math.max(1.5,w-1.5).toFixed(1)}" height="${h.toFixed(1)}" rx="${Math.min(4,Math.max(1,w/3)).toFixed(1)}" fill="${kindColor(s.kind,cat)}"/>`;x+=w});

const GYM_METRICS=[['w','Heaviest set','kg'],['1rm','Estimated 1RM','kg'],['r','Most reps in a set','reps']];
function keyMeta(key,names){const [g,a,b]=key.split(':');
 if(g==='g'){const m=GYM_METRICS.find(x=>x[0]===b)||GYM_METRICS[0];return{group:'gym',ex:(names&&names.get(a))||a,label:m[1],unit:m[2],dir:'hi'}}
 if(g==='r'){const d=RUN_D.find(x=>x[1]===a);if(d)return{group:'run',label:d[2],unit:'time',dir:'lo'};if(a==='long')return{group:'run',label:'Longest run',unit:'km',dir:'hi'};return{group:'run',label:'Best average pace',unit:'pace',dir:'lo'}}
 const m={long:['Longest ride','km'],elev:['Most elevation','m'],speed:['Fastest average speed','km/h']}[a]||['Ride','km'];return{group:'bike',label:m[0],unit:m[1],dir:'hi'}}
function candidates(s){const out=[];for(const x of s.ex){
 if(x.cat==='gym'){const n=norm(x.name);if(!n)continue;let hw=0,e1=0,mr=0;for(const z of x.sets||[]){if(z.t==='w')continue;const r=num(z.r),w=num(z.w);if(!(r>0))continue;if(w>0){hw=Math.max(hw,w);e1=Math.max(e1,r===1?w:w*(1+r/30))}mr=Math.max(mr,r)}
  if(hw)out.push({key:`g:${n}:w`,value:hw});if(e1)out.push({key:`g:${n}:1rm`,value:Math.round(e1*10)/10});if(mr)out.push({key:`g:${n}:r`,value:mr})}
 else if(x.cat==='run'){const d=num(x.dist),t=num(x.time);if(d>0){out.push({key:'r:long',value:d});if(t>0){const pace=t/d;if(d>=1)out.push({key:'r:pace',value:pace});for(const[km,k]of RUN_D)if(d>=km*0.995)out.push({key:'r:'+k,value:Math.round(pace*km)})}}}
 else if(x.cat==='bike'){const d=num(x.dist),t=num(x.time),e=num(x.elev);if(d>0)out.push({key:'b:long',value:d});if(e>0)out.push({key:'b:elev',value:e});if(d>=5&&t>0)out.push({key:'b:speed',value:Math.round(d/(t/3600)*10)/10})}
}return out}
let prCache=null;
function computePRs(){if(prCache&&prCache.s===S.sessions&&prCache.n===S.sessions.length&&prCache.p===S.prs.length&&prCache.v===saveVersion)return prCache.map;
 const names=exNames();const ev=[];
 for(const s of S.sessions)for(const c of candidates(s))ev.push({...c,t:s.start,sid:s.id,src:'auto'});
 for(const m of S.prs)ev.push({key:m.key,value:m.value,t:m.t,mid:m.id,src:'manual',note:m.note});
 ev.sort((a,b)=>a.t-b.t);const map={};
 for(const e of ev){let r=map[e.key];if(!r)r=map[e.key]={key:e.key,...keyMeta(e.key,names),best:null,hist:[]};const better=!r.best||(r.dir==='hi'?e.value>r.best.value:e.value<r.best.value);if(better){r.best=e;r.hist.push(e)}}
 prCache={s:S.sessions,n:S.sessions.length,p:S.prs.length,v:saveVersion,map};return map}
let saveVersion=0;
function prVal(unit,v){if(v===''||v==null)return '—';if(unit==='time')return fmtDur(v);if(unit==='pace')return fmtDur(v)+' /km';if(unit==='km')return fmtNum(v,2)+' km';if(unit==='kg')return fmtNum(v,1)+' kg';if(unit==='reps')return fmtNum(v,0)+' reps';if(unit==='m')return fmtNum(v,0)+' m';if(unit==='km/h')return fmtNum(v,1)+' km/h';return String(v)}
function prBig(unit,v){if(unit==='time')return[fmtDur(v),''];if(unit==='pace')return[fmtDur(v),'/km'];if(unit==='km')return[fmtNum(v,2),'km'];if(unit==='kg')return[fmtNum(v,1),'kg'];if(unit==='reps')return[fmtNum(v,0),'reps'];if(unit==='m')return[fmtNum(v,0),'m'];return[fmtNum(v,1),unit]}

function makeSampleV2(){let seed=11;const rnd=()=>{seed=(seed*16807)%2147483647;return(seed-1)/2147483646};const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
 const now=Date.now(),start=addDays(weekStart(now),-70);
 const mkW=(name,type,exs,custom='')=>({id:uid(),name,type,customName:custom,img:'',exercises:exs.map(e=>{const o={id:uid(),img:'',desc:'',dist:'',time:'',sets:[],...e};fixTpl(o);return o})});
 const G=(name,reps,w,extra={})=>({name,cat:'gym',rest:120,...extra,sets:reps.map(r=>r==='W'?{r:10,w:Math.round(w*0.5/2.5)*2.5,t:'w'}:r==='F'?{r:'',w,t:'f'}:{r,w,t:''})});
 const A=mkW('Push','gym',[G('Bench Press',['W',8,8,6,'F'],80,{notes:'Shoulder blades back, feet planted, bar to lower chest.',extra:['rpe']}),G('Overhead Press',[8,8,8],45),G('Incline Dumbbell Press',[10,10,10],26,{rest:90,inc:2}),G('Triceps Pushdown',['F','F','F'],30,{rest:60})]);
 const B=mkW('Pull','gym',[G('Deadlift',['W',5,5,5],140,{rest:180,inc:5,notes:'Brace before every rep. Reset at the floor.'}),G('Pull-ups',['F','F','F','F'],'',{bw:true}),G('Barbell Row',[8,8,8],70),G('Biceps Curl',[12,12,12],14,{rest:60,inc:1})]);
 const C=mkW('Legs','gym',[G('Back Squat',['W',6,6,6,6],110,{rest:180,inc:5}),G('Romanian Deadlift',[8,8,8],90),G('Leg Press',[12,12,12],180,{inc:10}),G('Calf Raise',['F','F','F'],60,{rest:60})]);
 const D=mkW('Intervals','run',[{name:'Track Intervals',cat:'run',mode:'struct',steps:PRESETS.run[0][1](),extra:['hr']}]);
 const E=mkW('Long Ride','bike',[{name:'Road Ride',cat:'bike',dist:60,tgt:'Zone 2',extra:['hr','power']}]);
 const F=mkW('Easy Run','run',[{name:'Easy Run',cat:'run',dist:8,tgt:'5:30-5:50',extra:['hr']}]);
 const p1={id:uid(),name:'Hybrid Week',img:'',mode:'week',created:start,workouts:[A,B,C,D,E,F],days:[],seqPos:0,seqDone:[],closedThrough:start};
 const U=mkW('Upper','gym',[G('Bench Press',[6,6,6],82.5),G('Barbell Row',[8,8,8],72.5)]);const L=mkW('Lower','gym',[G('Back Squat',[5,5,5],115),G('Romanian Deadlift',[8,8],92.5)]);const R=mkW('Zone 2 Run','run',[{name:'Easy Run',cat:'run',dist:10,tgt:'5:40-6:00'}]);
 const p2={id:uid(),name:'Upper / Lower',img:'',mode:'seq',created:start,workouts:[U,L,R],days:[{label:'',w:[U.id]},{label:'',w:[L.id]},{label:'',w:[]},{label:'',w:[U.id]},{label:'',w:[L.id]},{label:'',w:[R.id]},{label:'',w:[]}],seqPos:0,seqDone:[],closedThrough:null};
 const round=(v,s)=>Math.round(v/s)*s;
 const sim=(p,w,t,wi)=>{const s={id:uid(),start:t,planId:p.id,workoutId:w.id,name:w.name,type:w.type,customName:w.customName,notes:'',ex:[]};let dur=0;
  for(const e of w.exercises){const x={id:uid(),name:e.name,cat:e.cat,ref:[p.id,w.id,e.id],vals:{},extra:[...e.extra],custom:[],mg:e.mg||guessMG(e.name),bw:e.bw};
   if(e.cat==='gym'){x.sets=e.sets.map(z=>{const wt=z.w?round(z.w*(1+0.013*wi),z.w<30?1:2.5):'';const r=z.t==='f'?7+Math.floor(rnd()*4)+Math.floor(wi/3):z.t==='w'?10:z.r-(rnd()<0.18?1:0);return{w:wt,r,t:z.t}});dur+=x.sets.length*170;if(e.extra.includes('rpe'))x.vals.rpe=7+Math.floor(rnd()*3)}
   else if(e.cat==='run'&&e.mode==='struct'){x.flat=flatSteps(e.steps);let dm=0,tt=0;x.splits=x.flat.map(q=>{const pr=parsePace(q.tgt);let pace=pr?(pr[0]+pr[1])/2:440;pace=q.kind==='work'?pace+6-wi*0.9+(rnd()-.5)*8:pace+rnd()*20;if(q.by==='dist'){const tm=Math.round(q.v/1000*pace);dm+=q.v;tt+=tm;return{t:tm,m:''}}const m=Math.round(q.v/pace*1000);dm+=m;tt+=q.v;return{t:'',m}});x.dist=Math.round(dm/10)/100;x.time=tt;x.elev='';x.desc='';x.vals.hr=158+Math.floor(rnd()*8);dur+=tt}
   else if(e.cat==='run'){const d=Math.round((6.5+rnd()*4.6)*100)/100;const pace=352-2.6*wi+rnd()*14;x.dist=d;x.time=Math.round(d*pace);x.elev='';x.desc='';x.vals.hr=142+Math.floor(rnd()*8);dur+=x.time}
   else if(e.cat==='bike'){const d=Math.round((42+rnd()*38)*10)/10;const sp=26+0.25*wi+rnd()*2.2;x.dist=d;x.time=Math.round(d/sp*3600);x.elev=Math.round(300+rnd()*800);x.desc='';x.vals.hr=136+Math.floor(rnd()*10);x.vals.power=185+Math.floor(rnd()*30);dur+=x.time}
   s.ex.push(x)}
  s.duration=Math.round(dur+(w.type==='gym'?600:240));s.end=s.start+s.duration*1000;if(w.type==='bike')s.source='strava';return s};
 const padel=(t,res)=>({id:uid(),start:t,planId:null,workoutId:null,name:'Padel',type:'custom',customName:'Padel',notes:'',duration:5400,end:t+5400e3,ex:[{id:uid(),name:'Padel',cat:'other',ref:null,time:5400,dist:'',elev:'',desc:'Doubles at the club',extra:['rpe'],custom:[{id:'res',label:'Result',unit:'',kind:'text'}],vals:{rpe:7,c_res:res}}]});
 const pool=[A,B,C,D,E,F],sessions=[];
 for(let wi=0;wi<=10;wi++){const ws=addDays(start,7*wi);let picks;
  if(wi===10)picks=[[0,0],[2,2]];
  else{const k=3+Math.floor(rnd()*3);const order=shuffle([0,1,2,3,4,5]).slice(0,k);const days=shuffle([0,1,2,3,4,5,6]).slice(0,k).sort((a,b)=>a-b);picks=order.map((o,i)=>[o,days[i]])}
  for(const[oi,dd]of picks){const t=addDays(ws,dd)+(oi===4?9:18)*3600e3+Math.floor(rnd()*40)*60e3;if(t>now)continue;sessions.push(sim(p1,pool[oi],t,wi))}
  if(wi%3===1||wi===10){const t=addDays(ws,5)+19*3600e3;if(t<now)sessions.push(padel(t,['Won 6-4 6-3','Lost 4-6 6-7','Won 6-2 3-6 6-4'][wi%3]))}}
 sessions.sort((a,b)=>a.start-b.start);
 const body=[];for(let i=0;i<=10;i++){body.push({id:uid(),t:addDays(start,7*i)+7.5*3600e3,kg:Math.round((82.6-i*0.24+(rnd()-.5)*0.6)*10)/10,bf:i%3===0?Math.round((17.8-i*0.15)*10)/10:'',waist:''})}
 const stt=emptyState();
 Object.assign(stt,{sample:true,plans:[p1,p2],activePlanId:p1.id,sessions,body,
  goals:[{id:uid(),kind:'workouts',period:'week',target:5},{id:uid(),kind:'runKm',period:'month',target:60},{id:uid(),kind:'lift',ex:'Bench Press',target:100},{id:uid(),kind:'bw',target:78,start:82.6}],
  prs:[{id:uid(),key:'r:5k',value:22*60+48,t:new Date(2025,8,14,10).getTime(),note:'From Strava'},{id:uid(),key:'r:hm',value:3600+49*60+30,t:new Date(2025,3,6,9).getTime(),note:'From Strava'},{id:uid(),key:'g:deadlift:w',exName:'Deadlift',value:160,t:new Date(2025,5,1,18).getTime(),note:''}]});
 return stt}

 const max=Math.max(1,...vals),W=300,H=40,bw=W/12;
 return `<svg class="viz" viewBox="0 0 ${W} ${H+14}" aria-hidden="true">${vals.map((v,i)=>{const h=Math.max(3,v/max*H);return `<rect x="${(i*bw+2).toFixed(1)}" y="${(H-h).toFixed(1)}" width="${(bw-4).toFixed(1)}" height="${h.toFixed(1)}" rx="3" fill="currentColor" opacity="${v?(i===11?1:.45):.15}"/>`}).join('')}<text x="0" y="${H+12}" fill="currentColor" opacity=".7" style="font-size:10px">12 weeks ago</text><text x="${W}" y="${H+12}" text-anchor="end" fill="currentColor" opacity=".7" style="font-size:10px">This week</text></svg>`}

 switch(f.k){
  case 'month':{const n=sessionsIn(monthStart(now),Infinity).length;return{label:'Workouts this month',big:n,unit:n===1?'workout':'workouts',sub:fmtDate(now,{month:'long',year:'numeric'}),viz:weekBars('count')}}

  case 'dayStreak':{const n=dayStreak();return{label:'Day streak',big:n,unit:n===1?'day':'days',sub:'Consecutive days with a workout',viz:dayDots()}}
  case 'runMonth':{const v=sessionsIn(monthStart(now),Infinity).reduce((t,s)=>t+sMetrics(s).rd,0);return{label:'Running this month',big:fmtNum(v,1),unit:'km',sub:fmtDate(now,{month:'long',year:'numeric'}),viz:weekBars('run')}}
  case 'bikeMonth':{const v=sessionsIn(monthStart(now),Infinity).reduce((t,s)=>t+sMetrics(s).bd,0);return{label:'Cycling this month',big:fmtNum(v,0),unit:'km',sub:fmtDate(now,{month:'long',year:'numeric'}),viz:weekBars('bike')}}
  case 'pr':{const r=computePRs()[f.key];if(!r||!r.best)return{label:'Personal record',big:'—',unit:'',sub:'No record yet for this one'};const[b,u]=prBig(r.unit,r.best.value);return{label:(r.ex?r.ex+' · ':'')+r.label,big:b,unit:u,sub:'Set on '+fmtDateY(r.best.t)+(r.best.src==='manual'?' · added by you':''),viz:''}}

function stepsEditor(e,b,cat){
 const rows=e.steps.map((s,i)=>s.kind==='repeat'?`<div class="repeat" style="--c:var(--${cat})"><div class="steptop">${ic('repeat',18)}<b>Repeat</b><input class="in sm num" style="width:64px;text-align:center" id="rn-${s.id}" inputmode="numeric" value="${esc(s.n)}" data-b="st|${b}|${i}|n" data-t="int" data-pf="${e.id}"><span class="muted sm" style="flex:1">times</span><button class="xbtn" data-act="stepRm" data-b="${b}" data-path="${i}" aria-label="Remove block">${ic('x',16)}</button></div>${(s.steps||[]).map((c,j)=>stepRow(e,b,c,i+'.'+j,cat)).join('')}<button class="btn sm" data-act="stepAdd" data-b="${b}" data-parent="${i}">${ic('plus',16)} Step in block</button></div>`:stepRow(e,b,s,String(i),cat)).join('');
 return `${profileBlock(e,cat,e.id)}
 <div class="field"><span>Start from a template</span><div class="presets">${PRESETS[cat].map((p,k)=>`<button class="tchip" data-act="preset" data-b="${b}" data-k="${k}">${esc(p[0])}</button>`).join('')}</div></div>
 ${rows}
 <div class="btnrow"><button class="btn sm" data-act="stepAdd" data-b="${b}">${ic('plus',16)} Step</button><button class="btn sm" data-act="addRepeat" data-b="${b}">${ic('repeat',16)} Repeat block</button></div>
 <p class="hint">${cat==='run'?'Paces accept one value like <b>4:05</b> or a range like <b>4:00-4:10</b>. Bars grow taller as the target pace gets faster.':'Targets are free text, like <b>Zone 3</b>, <b>250 W</b> or <b>32 km/h</b>.'}</p>`}
function extrasPicker(cat,list,act,attrs){return `<div class="field"><span>Also record</span><div class="chips">${EXTRA_FOR[cat].map(k=>`<button class="tchip ${list.includes(k)?'on':''}" data-act="${act}" ${attrs} data-k="${k}" aria-pressed="${list.includes(k)}">${list.includes(k)?ic('check',14):''}${EXTRAS[k][0]}</button>`).join('')}</div></div>`}
function customEditor(list,bindPrefix,act,attrs){return `<div class="field"><span>Custom fields</span>${list.map((c,i)=>`<div class="cfrow"><input class="in sm" id="cl-${c.id}" value="${esc(c.label)}" placeholder="Name, e.g. Result" data-b="${bindPrefix}|${i}|label" autocomplete="off"><input class="in sm" id="cu-${c.id}" value="${esc(c.unit)}" placeholder="unit" data-b="${bindPrefix}|${i}|unit" autocomplete="off"><select class="in sm" id="ck-${c.id}" data-b="${bindPrefix}|${i}|kind">${[['num','Number'],['time','Time'],['text','Text']].map(([k,l])=>`<option value="${k}" ${c.kind===k?'selected':''}>${l}</option>`).join('')}</select><button class="xbtn" data-act="${act}Rm" ${attrs} data-i="${i}" aria-label="Remove field">${ic('x',16)}</button></div>`).join('')}<button class="btn sm" data-act="${act}Add" ${attrs}>${ic('plus',16)} Add custom field</button></div>`}
function tplDerived(e){const d=num(e.dist),t=num(e.time);const pr=e.cat==='run'?parsePace(e.tgt):null;
 if(e.cat==='run'){if(d>0&&t>0)return `<span>Pace needed</span><b>${fmtDur(t/d)} /km</b>`;if(d>0&&pr)return `<span>Estimated time</span><b>${fmtDur(d*pr[0])}${pr[0]!==pr[1]?'–'+fmtDur(d*pr[1]):''}</b>`;if(t>0&&pr)return `<span>Estimated distance</span><b>${fmtNum(t/pr[1],1)}–${fmtNum(t/pr[0],1)} km</b>`;return `<span>Add a distance with a pace or a time</span><b>—</b>`}
 if(d>0&&t>0)return `<span>Average speed needed</span><b>${fmtNum(d/(t/3600),1)} km/h</b>`;return `<span>Add a distance and time for the speed needed</span><b>—</b>`}
function tplExCardV2(p,w,e,i,n){const b=`${p.id}|${w.id}|${e.id}`;const cat=e.cat;let body='';
 if(cat==='gym'){let wn=0;body=`<div class="setgrid tpl"><span class="hd">Set</span><span class="hd">${e.bw?'+kg':'kg'}</span><span class="hd">Reps</span><span class="hd">Tag</span><span></span>
