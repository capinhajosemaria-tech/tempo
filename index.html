  <button class="btn sm" data-act="tplAddSet" data-b="${b}">${ic('plus',16)} Add set</button><p class="hint">Each set has its own weight and reps. Tap the tag to mark <b>W</b> warm-up, <b>F</b> to failure or <b>D</b> drop set. Warm-ups don't count towards records or volume.</p>`}
 else if(cat==='run'||cat==='bike'){body=`${seg([['steady','Steady'],['struct','Intervals']],e.mode,'tplMode',`data-b="${b}"`)}
  ${e.mode==='struct'?stepsEditor(e,b,cat):`<div class="grid2"><label class="field"><span>Target distance (km)</span><input class="in" id="td-${e.id}" inputmode="decimal" value="${esc(e.dist)}" data-b="e|${b}|dist" data-t="num" data-ed="${e.id}" placeholder="optional"></label><label class="field"><span>Target time</span><input class="in" id="tt-${e.id}" value="${esc(fmtDur(e.time))}" data-b="e|${b}|time" data-t="dur" data-ed="${e.id}" placeholder="h:mm:ss"></label></div>
  <label class="field"><span>${cat==='run'?'Target pace /km':'Target'}</span><input class="in" id="tp-${e.id}" value="${esc(e.tgt)}" data-b="e|${b}|tgt" data-ed="${e.id}" placeholder="${cat==='run'?'5:30 or 5:20-5:40':'Zone 2, 28 km/h, 200 W'}" autocomplete="off"></label>
  <div class="derived" data-edv="${e.id}">${tplDerived(e)}</div>`}`}
 else{body=`<label class="field"><span>Target time</span><input class="in" id="tt-${e.id}" value="${esc(fmtDur(e.time))}" data-b="e|${b}|time" data-t="dur" placeholder="minutes or h:mm:ss"></label><label class="field"><span>Description</span><textarea class="in" id="tx-${e.id}" data-b="e|${b}|desc" placeholder="What to do">${esc(e.desc)}</textarea></label>`}
 const mg=e.mg||guessMG(e.name);
 const opts=`<details class="opts" data-open="${e.id}" ${ui.open.has(e.id)?'open':''}><summary>${ic('chev',16)} More options</summary><div class="inner">
  ${cat==='gym'?`<div class="grid2"><label class="field"><span>Rest between sets</span><input class="in" id="rs-${e.id}" value="${esc(fmtDur(e.rest))}" data-b="e|${b}|rest" data-t="dur" placeholder="1:30"></label><label class="field"><span>Weight step (kg)</span><input class="in" id="ri-${e.id}" inputmode="decimal" value="${esc(e.inc)}" data-b="e|${b}|inc" data-t="num" placeholder="${fmtNum(S.settings.inc,2)}"></label></div>
  ${sw(e.prog!==false&&!e.bw,'tplProg',`data-b="${b}"`,'Suggest heavier weights when I hit every target')}
  ${sw(e.bw,'tplBW',`data-b="${b}"`,'Bodyweight exercise')}
  <div class="field"><span>Muscle group${!e.mg&&mg?' · guessed from the name':''}</span><div class="chips">${Object.entries(MG).map(([k,l])=>`<button class="tchip ${mg===k?'on':''}" data-act="tplMG" data-b="${b}" data-k="${k}">${l}</button>`).join('')}</div></div>`:''}
  <label class="field"><span>Notes and cues</span><textarea class="in" id="nc-${e.id}" data-b="e|${b}|notes" placeholder="${cat==='gym'?'e.g. Pause at the bottom, 3-1-1 tempo':'e.g. Flat route, keep cadence high'}">${esc(e.notes)}</textarea></label>
  ${extrasPicker(cat,e.extra,'tplExtra',`data-b="${b}"`)}
  ${customEditor(e.custom,'cf|'+b,'tplCf',`data-b="${b}"`)}
 </div></details>`;
 return `<div class="excard"><div class="exhead">${imgPick('ex|'+b,e.img,'small','Exercise photo')}<div class="grow"><input class="in" id="en-${e.id}" value="${esc(e.name)}" placeholder="Exercise name" list="exnames" data-b="e|${b}|name" autocomplete="off" style="font-weight:650"><select class="in sm" id="ec-${e.id}" data-b="e|${b}|cat" data-rr="1">${Object.entries(CAT).map(([k,l])=>`<option value="${k}" ${cat===k?'selected':''}>${l}</option>`).join('')}</select></div></div>
 ${body}${opts}
 <div class="tools" style="justify-content:space-between"><div class="tools"><button class="iconbtn sm" data-act="tplMove" data-b="${b}" data-d="-1" ${i===0?'disabled style="opacity:.35"':''} aria-label="Move up">${ic('up',18)}</button><button class="iconbtn sm" data-act="tplMove" data-b="${b}" data-d="1" ${i===n-1?'disabled style="opacity:.35"':''} aria-label="Move down">${ic('down',18)}</button></div><button class="btn sm danger" data-act="tplRmEx" data-b="${b}" data-confirm="Tap again">Remove exercise</button></div></div>`}
function vWorkoutV2({pid,wid}){const p=planById(pid),w=wkOf(p,wid);if(!w)return topbar('Workout')+'<p class="muted">This workout was deleted.</p>';

 ${imgPick('wk|'+p.id+'|'+w.id,w.img,'cover','Add workout photo')}

 <div class="field"><span>Type</span>${seg([['gym','Gym'],['run','Running'],['bike','Cycling'],['other','Other'],['custom','Custom']],w.type,'setWType',`data-pid="${p.id}" data-wid="${w.id}"`)}</div>
 ${w.type==='custom'?`<label class="field"><span>Custom type name</span><input class="in" id="wc-${w.id}" value="${esc(w.customName)}" data-b="w|${p.id}|${w.id}|customName" placeholder="e.g. Swimming, Mobility, Padel" autocomplete="off"></label>`:''}
 <div class="sec"><div class="h2">Exercises</div><span class="muted sm">${w.exercises.length}</span></div>
 ${w.exercises.map((e,i)=>tplExCard(p,w,e,i,w.exercises.length)).join('')}
 <button class="btn block" data-act="tplAddEx" data-pid="${p.id}" data-wid="${w.id}">${ic('plus',18)} Add exercise</button>
 <p class="hint">Each exercise can be Gym (sets, reps, weight), Running or Cycling (steady or intervals) or Other (time and notes). More options holds rest times, weight suggestions, muscle groups, cues, heart rate, effort and your own fields.</p>

/* ================= SESSION ================= */
function blankEx(name,cat){const x={id:uid(),name,cat,ref:null,tgt:null,notes:'',rest:cat==='gym'?90:'',bw:false,extra:[],custom:[],vals:{},mg:cat==='gym'?guessMG(name):''};if(cat==='gym')x.sets=[{w:'',r:'',t:'',d:false},{w:'',r:'',t:'',d:false},{w:'',r:'',t:'',d:false}];else{x.dist='';x.time='';x.elev='';x.desc=''}return x}
function newAdhoc(name,cat,past){const prev=[...S.sessions].reverse().find(s=>!s.planId&&norm(s.name)===norm(name));
 const t=prev?prev.type:(cat==='other'?'custom':cat);
 const s={id:uid(),start:past?Date.now()-3600e3:Date.now(),planId:null,workoutId:null,name,type:t,customName:t==='custom'?(prev?prev.customName:name):'',notes:'',past:!!past,duration:past?3600:'',ex:[]};
 if(prev)s.ex=prev.ex.map(x=>{const n=blankEx(x.name,x.cat);n.extra=[...(x.extra||[])];n.custom=clone(x.custom||[]);n.rest=x.rest??n.rest;n.mg=x.mg||n.mg;if(x.cat==='gym')n.sets=(x.sets||[]).map(z=>({w:z.w,r:z.r,t:z.t||'',d:false}));if(x.cat==='other')n.desc=x.desc||'';return n});
 else if(cat!=='gym'){const x=blankEx(name,cat);if(cat==='other')x.extra=['rpe'];s.ex=[x]}
 return s}
function derivedHTML(x){const d=num(x.dist),t=num(x.time);
 if(x.cat==='run'){const pr=x.tgt&&parsePace(x.tgt.pace);const pace=d>0&&t>0?t/d:null;const cls=pace&&pr?(pace<pr[0]-3?'fast':pace>pr[1]+3?'slow':'ok'):'';return `<span>Pace${pr?` · target ${fmtPaceR(pr)}`:''}</span><b class="${cls}">${pace?fmtDur(pace)+' /km':'—'}</b>`}
 if(x.cat==='bike')return `<span>Average speed</span><b>${d>0&&t>0?fmtNum(d/(t/3600),1)+' km/h':'—'}</b>`;return ''}
function splitInfo(x,i){const s=x.flat[i],sp=x.splits[i];const dist=s.by==='dist'?num(s.v):num(sp.m);const time=s.by==='dist'?num(sp.t):num(s.v);if(!(dist>=20&&time>0))return '<span class="muted">—</span>';
 if(x.cat==='run'){const pace=time/(dist/1000);const pr=parsePace(s.tgt);const cls=pr?(pace<pr[0]-3?'fast':pace>pr[1]+3?'slow':'ok'):'';return `<span class="${cls}">${fmtDur(pace)}</span>`}
 return `<span>${fmtNum(dist/1000/(time/3600),1)}</span>`}
function splitSum(x){let m=0,t=0,c=0;x.flat.forEach((s,i)=>{const sp=x.splits[i];const dm=s.by==='dist'?num(s.v):num(sp.m);const tt=s.by==='dist'?num(sp.t):num(s.v);if(dm>=20&&tt>0){m+=dm;t+=tt;c++}});return{m,t,c}}
function splitSumHTML(x){const q=splitSum(x);return q.c?`From ${q.c} of ${x.flat.length} steps: <b>${fmtNum(q.m/1000,2)} km · ${fmtDur(q.t)}</b> <button class="btn sm" data-act="useSplits" data-eid="${x.id}" style="margin-left:6px">Use as totals</button>`:'Fill in the steps you ran, or just the totals.'}
function splitsBlock(x){const cat=x.cat;
 return `<div class="profile">${profileSVG(x.flat,cat)}</div><div>${x.flat.map((s,i)=>{const sp=x.splits[i];const head=kindLabel(s.kind,cat)+(s.of?` ${s.rep}/${s.of}`:'');const val=s.by==='dist'?fmtM(s.v,cat):fmtDur(s.v);
  const inp=s.by==='dist'?`<input class="in" id="spt-${x.id}-${i}" value="${esc(fmtDur(sp.t))}" placeholder="time" data-b="sp|${x.id}|${i}|t" data-t="dur" data-spl="${x.id}|${i}">`:`<input class="in" id="spm-${x.id}-${i}" inputmode="decimal" value="${cat==='bike'?plain(num(sp.m)/1000,2):esc(sp.m)}" placeholder="${cat==='bike'?'km':'metres'}" data-b="sp|${x.id}|${i}|m" data-t="${cat==='bike'?'km2m':'num'}" data-spl="${x.id}|${i}">`;
  return `<div class="split ${s.kind}"><span class="kdot" style="--k:${kindColor(s.kind,cat)}"></span><span class="lab"><b>${esc(head)} · ${val}</b><span>${s.tgt?(cat==='run'&&parsePace(s.tgt)?fmtPaceR(parsePace(s.tgt)):esc(s.tgt)):'no target'}</span></span>${inp}<span class="spd" data-spd="${x.id}|${i}">${splitInfo(x,i)}</span></div>`}).join('')}</div>
  <p class="hint" data-ssum="${x.id}">${splitSumHTML(x)}</p>`}
function lastLine(x){const l=lastEx(x.name,x.cat);if(!l)return '';
 if(x.cat==='gym')return `Last time: <b>${(l.sets||[]).map(z=>`${z.t==='w'?'W ':''}${z.w!==''&&num(z.w)>0?fmtNum(z.w,1)+'×':''}${z.r!==''?z.r:''}${z.t==='f'?'F':''}`).join(' · ')}</b>`;
 if(x.cat==='run')return `Last time: <b>${fmtNum(l.dist,2)} km in ${fmtDur(l.time)}${num(l.dist)>0&&num(l.time)>0?' · '+fmtDur(l.time/l.dist)+' /km':''}</b>`;
 if(x.cat==='bike')return `Last time: <b>${fmtNum(l.dist,1)} km in ${fmtDur(l.time)}${l.elev?` · ${l.elev} m`:''}</b>`;
 return l.time?`Last time: <b>${fmtDur(l.time)}</b>`:''}
function extrasInputs(x){const a=(x.extra||[]).map(k=>`<label class="field"><span>${EXTRAS[k][0]} <em>${extraUnit(k,x.cat)}</em></span><input class="in" id="xv-${x.id}-${k}" inputmode="decimal" value="${esc(x.vals[k]??'')}" data-b="sv|${x.id}|${k}" data-t="num"></label>`);
 const c=(x.custom||[]).map(f=>{const v=x.vals['c_'+f.id];return `<label class="field"><span>${esc(f.label||'Field')} ${f.unit?`<em>${esc(f.unit)}</em>`:''}</span><input class="in" id="xc-${x.id}-${f.id}" ${f.kind==='num'?'inputmode="decimal"':''} value="${esc(f.kind==='time'?fmtDur(v):(v??''))}" data-b="sv|${x.id}|c_${f.id}" data-t="${f.kind==='num'?'num':f.kind==='time'?'dur':'text'}" placeholder="${f.kind==='time'?'h:mm:ss':''}" autocomplete="off"></label>`});
 const all=[...a,...c];return all.length?`<div class="grid2">${all.join('')}</div>`:''}
/* ================= HISTORY ================= */
function wsumCard(w){const ex=countNames(w.extra||[]);return `<div class="wsum"><div class="top"><div class="eyebrow">Week of ${fmtDate(w.week)} · ${esc(w.planName)}</div><span class="score">${w.done.length}/${w.target}</span></div>
 <dl class="kv"><dt>Done</dt><dd>${w.done.length?w.done.map(d=>esc(d.l+' '+d.name)).join(', '):'None'}</dd><dt>Missed</dt><dd>${w.missed.length?w.missed.map(d=>esc(d.l+' '+d.name)).join(', '):'Nothing, full week'}</dd>${ex.length?`<dt>Also</dt><dd>${esc(ex.join(', '))}</dd>`:''}<dt>Days off</dt><dd>${plural(w.daysOff,'day')} without training</dd></dl></div>`}
function calendarHTML(){const m=ui.calMonth;const nm=addMonths(m,1);const start=weekStart(m);const now=Date.now();let cells='';let t=start;
 while(t<nm||(new Date(t).getDay()+6)%7!==0){const day=sessionsIn(t,addDays(t,1));const inM=t>=m&&t<nm;cells+=`<button class="cday ${day.length?'has':''} ${ymd(t)===ymd(now)?'today':''} ${ui.calDay===ymd(t)?'sel':''} ${inM?'':'out'}" data-act="calDay" data-d="${ymd(t)}"><span>${new Date(t).getDate()}</span><span class="wdots">${day.slice(0,3).map(s=>`<i style="--c:var(--${typeKey(s)})"></i>`).join('')}</span></button>`;t=addDays(t,1);if(t-start>45*DAY)break}
 const ms=sessionsIn(m,nm);const mm=ms.reduce((a,s)=>{const q=sMetrics(s);a.km+=q.rd+q.bd;a.t+=s.duration||0;return a},{km:0,t:0});
 const sel=ui.calDay?S.sessions.filter(s=>ymd(s.start)===ui.calDay):[];
 return `<div class="card"><div class="calnav"><button class="iconbtn sm" data-act="calMove" data-d="-1" aria-label="Previous month">${ic('back',18)}</button><div style="text-align:center"><div class="h3">${fmtDate(m,{month:'long',year:'numeric'})}</div><div class="muted xs num">${plural(ms.length,'workout')} · ${fmtNum(mm.km,0)} km · ${fmtHM(mm.t)}</div></div><button class="iconbtn sm" data-act="calMove" data-d="1" aria-label="Next month">${ic('chev',18)}</button></div>
 <div class="cal">${'MTWTFSS'.split('').map(d=>`<span class="hd">${d}</span>`).join('')}${cells}</div></div>
 ${ui.calDay?`<div class="sec"><div class="h3">${fmtDate(new Date(ui.calDay+'T12:00').getTime(),{weekday:'long',day:'numeric',month:'long'})}</div></div>${sel.length?`<div class="list">${sel.map(sessionRow).join('')}</div>`:'<p class="muted sm">No workouts on this day.</p>'}`:'<p class="hint">Tap a day to see its workouts.</p>'}`}
function extrasView(x){const items=[];for(const k of x.extra||[]){const v=x.vals&&x.vals[k];if(v!==''&&v!=null)items.push([EXTRAS[k][0],fmtNum(v,1)+' '+extraUnit(k,x.cat)])}for(const f of x.custom||[]){const v=x.vals&&x.vals['c_'+f.id];if(v!==''&&v!=null)items.push([f.label||'Field',(f.kind==='time'?fmtDur(v):f.kind==='num'?fmtNum(v,2):v)+(f.unit?' '+f.unit:'')])}
 return items.length?`<div class="metrics">${items.map(([l,v])=>`<div class="metric"><span>${esc(l)}</span><b style="font-size:17px">${esc(v)}</b></div>`).join('')}</div>`:''}
function vSDetail({id}){const s=S.sessions.find(z=>z.id===id);if(!s)return topbar('Workout')+'<p class="muted">This workout was deleted.</p>';
 const pl=planById(s.planId);const m=sMetrics(s);
 const exHTML=s.ex.map(x=>{let b='';
  if(x.cat==='gym'){let wn=0;b=`<div class="setlist">${(x.sets||[]).map(z=>`<span class="n">${z.t==='w'?'W':++wn}</span><span>${num(z.w)>0?fmtNum(z.w,1)+' kg × ':x.bw?'BW × ':''}${z.r!==''?z.r+' reps':''}${z.t==='f'?` <span class="pill" style="--c:var(--gym)">failure</span>`:z.t==='d'?` <span class="pill" style="--c:var(--other)">drop</span>`:''}</span><span class="muted sm">${z.t!=='w'&&num(z.w)>0&&num(z.r)>0?fmtNum(z.w*z.r,0)+' kg':''}</span>`).join('')}</div>`}
  else if(x.cat==='run'||x.cat==='bike'){const sp=num(x.dist)>0&&num(x.time)>0;b=`<div class="metrics"><div class="metric"><span>Distance</span><b>${fmtNum(x.dist,2)||'—'} km</b></div><div class="metric"><span>Time</span><b>${fmtDur(x.time)||'—'}</b></div><div class="metric"><span>${x.cat==='run'?'Pace':'Avg speed'}</span><b>${sp?(x.cat==='run'?fmtDur(x.time/x.dist):fmtNum(x.dist/(x.time/3600),1)):'—'}</b></div>${x.cat==='bike'?`<div class="metric"><span>Elevation</span><b>${x.elev!==''?fmtNum(x.elev,0)+' m':'—'}</b></div>`:''}</div>
   ${x.flat?`<div class="profile">${profileSVG(x.flat,x.cat)}</div><div>${x.flat.map((q,i)=>{const sp2=x.splits[i];const has=(q.by==='dist'?num(sp2.t):num(sp2.m))>0;return `<div class="split ${q.kind}" style="grid-template-columns:12px minmax(0,1fr) auto 56px"><span class="kdot" style="--k:${kindColor(q.kind,x.cat)}"></span><span class="lab"><b>${esc(kindLabel(q.kind,x.cat)+(q.of?` ${q.rep}/${q.of}`:''))} · ${q.by==='dist'?fmtM(q.v,x.cat):fmtDur(q.v)}</b><span>${q.tgt?esc(q.tgt):'no target'}</span></span><span class="num sm">${has?(q.by==='dist'?fmtDur(sp2.t):fmtM(sp2.m,x.cat)):''}</span><span class="spd">${has?splitInfo(x,i):''}</span></div>`}).join('')}</div>`:''}`}
  else{b=`<div class="metrics"><div class="metric"><span>Time</span><b>${fmtDur(x.time)||'—'}</b></div></div>${x.desc?`<p class="sm">${esc(x.desc)}</p>`:''}`}
  return `<div class="card"><div class="sec" style="margin:0"><div class="h3">${esc(x.name||'Exercise')}</div>${typePill({type:x.cat})}</div>${b}${extrasView(x)}</div>`}).join('');
 return `${topbar(s.name,`<button class="btn sm" data-act="editSession" data-id="${s.id}">Edit</button>`)}
 <div><div class="eyebrow">${fmtDate(s.start,{weekday:'long',day:'numeric',month:'long',year:'numeric'})}</div><h1 class="h1">${esc(s.name)}</h1></div>
 <div class="sessionhead">${typePill(s)}<span class="muted sm">${pl?esc(pl.name):'Off-plan'}</span>${s.source==='strava'?'<span class="srcb">From Strava</span>':''}</div>
 <div class="tiles"><div class="tile"><b class="num">${fmtHM(s.duration)}</b><span>duration</span></div><div class="tile"><b class="num">${new Date(s.start).toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'})}</b><span>start</span></div><div class="tile"><b class="num">${m.vol?fmtNum(m.vol/1000,2)+'<small>t</small>':m.rd?fmtNum(m.rd,1)+'<small>km</small>':m.bd?fmtNum(m.bd,0)+'<small>km</small>':s.ex.length}</b><span>${m.vol?'volume':m.rd||m.bd?'distance':'exercises'}</span></div></div>
 ${exHTML}
 ${s.notes?`<div class="card"><div class="eyebrow">Notes</div><p>${esc(s.notes)}</p></div>`:''}
 <button class="btn danger block" data-act="delSession" data-id="${s.id}" data-confirm="Tap again to delete">Delete workout</button>`}

/* ================= STATS ================= */
function niceMax(v,int){if(!(v>0))return int?4:1;const raw=v/4;const e=Math.pow(10,Math.floor(Math.log10(raw)));const f=raw/e;let s=(int?(f<=1?1:f<=2?2:f<=5?5:10):(f<=1?1:f<=2?2:f<=2.5?2.5:f<=5?5:10))*e;if(int)s=Math.max(1,Math.round(s));return s*4}
function fmtAxis(v){if(Math.abs(v)>=1000)return fmtNum(v/1000,1)+'k';return fmtNum(v,Math.abs(v)<10?1:0)}
function barChart({labels,series,fmt=fmtAxis,target=null,H=170,int=false}){const n=labels.length;if(!n)return '';const W=340,L=34,R=6,T=10,B=22;
 const tot=labels.map((_,i)=>series.reduce((a,s)=>a+(+s.values[i]||0),0));const max=niceMax(Math.max(...tot,target||0),int);const pw=W-L-R,ph=H-T-B,bw=pw/n,gap=Math.max(1,Math.min(bw*0.3,8));
 let g='';for(let k=0;k<=4;k++){const y=T+ph-ph*k/4;g+=`<line x1="${L}" x2="${W-R}" y1="${y.toFixed(1)}" y2="${y.toFixed(1)}" class="gl"/><text x="${L-6}" y="${(y+3.5).toFixed(1)}" class="ax" text-anchor="end">${fmt(max*k/4)}</text>`}
 let bars='';for(let i=0;i<n;i++){let y0=T+ph;const x=L+i*bw+gap/2,w=Math.max(1,bw-gap);for(const s of series){const v=+s.values[i]||0;if(!v)continue;const h=v/max*ph;bars+=`<rect x="${x.toFixed(1)}" y="${(y0-h).toFixed(1)}" width="${w.toFixed(1)}" height="${h.toFixed(1)}" rx="${Math.min(3,w/3).toFixed(1)}" fill="${s.color}" opacity="${i===n-1?1:.8}"/>`;y0-=h}}
 const step=Math.ceil(n/6);let xl='';for(let i=0;i<n;i++){if((n-1-i)%step)continue;xl+=`<text x="${(L+i*bw+bw/2).toFixed(1)}" y="${H-6}" class="ax" text-anchor="middle">${esc(labels[i])}</text>`}
 const tl=target?`<line x1="${L}" x2="${W-R}" y1="${(T+ph-target/max*ph).toFixed(1)}" y2="${(T+ph-target/max*ph).toFixed(1)}" class="tgt"/>`:'';
 return `<svg viewBox="0 0 ${W} ${H}" class="chart" role="img">${g}${bars}${tl}${xl}</svg>`}
function lineChart({series,fmt=fmtAxis,invert=false,H=170}){const pts=series.flatMap(s=>s.pts);if(!pts.length)return '';const W=340,L=40,R=16,T=18,B=22;
 let t0=Math.min(...pts.map(p=>p.t)),t1=Math.max(...pts.map(p=>p.t));if(t1===t0){t0-=DAY*3;t1+=DAY*3}
 const lo=Math.min(...pts.map(p=>p.v)),hi=Math.max(...pts.map(p=>p.v));const pad=(hi-lo)*0.15||Math.abs(hi)*0.1||1;let v0=lo-pad,v1=hi+pad;if(lo>=0&&v0<0)v0=0;
 const pw=W-L-R,ph=H-T-B;const X=t=>L+(t-t0)/(t1-t0)*pw;const Y=v=>invert?T+(v-v0)/(v1-v0)*ph:T+ph-(v-v0)/(v1-v0)*ph;
 let g='';for(let k=0;k<=3;k++){const v=v0+(v1-v0)*k/3;const y=Y(v);g+=`<line x1="${L}" x2="${W-R}" y1="${y.toFixed(1)}" y2="${y.toFixed(1)}" class="gl"/><text x="${L-6}" y="${(y+3.5).toFixed(1)}" class="ax" text-anchor="end">${fmt(v)}</text>`}
 let body='';series.forEach((s,si)=>{const p=[...s.pts].sort((a,b)=>a.t-b.t);if(!p.length)return;const d=p.map((q,i)=>`${i?'L':'M'}${X(q.t).toFixed(1)} ${Y(q.v).toFixed(1)}`).join(' ');
  if(si===0&&p.length>1){const base=invert?T:T+ph;body+=`<path d="${d} L${X(p[p.length-1].t).toFixed(1)} ${base} L${X(p[0].t).toFixed(1)} ${base}Z" fill="${s.color}" fill-opacity=".1" stroke="none"/>`}
  body+=`<path d="${d}" fill="none" stroke="${s.color}" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>`;
  if(p.length<=30)body+=p.slice(0,-1).map(q=>`<circle cx="${X(q.t).toFixed(1)}" cy="${Y(q.v).toFixed(1)}" r="2.4" fill="${s.color}"/>`).join('');
  const e=p[p.length-1];body+=`<circle cx="${X(e.t).toFixed(1)}" cy="${Y(e.v).toFixed(1)}" r="5" fill="var(--surface)" stroke="${s.color}" stroke-width="2.5"/>`;
  if(si===0)body+=`<text x="${Math.min(X(e.t),W-R).toFixed(1)}" y="${(Y(e.v)-10).toFixed(1)}" class="lbl" text-anchor="end">${esc(fmt(e.v))}</text>`});
 const xl=`<text x="${L}" y="${H-6}" class="ax">${fmtDate(t0)}</text><text x="${W-R}" y="${H-6}" class="ax" text-anchor="end">${fmtDate(t1)}</text>`;
 return `<svg viewBox="0 0 ${W} ${H}" class="chart" role="img">${g}${body}${xl}</svg>`}
function heatmapSVG(){const weeks=26,cs=11,g=2,step=cs+g;const end=weekStart(Date.now());const start=addDays(end,-7*(weeks-1));const counts=new Map();for(const s of S.sessions){const k=ymd(s.start);counts.set(k,(counts.get(k)||0)+1)}
 let r='';for(let w=0;w<weeks;w++)for(let d=0;d<7;d++){const t=addDays(start,w*7+d);if(t>Date.now())continue;const c=counts.get(ymd(t))||0;r+=`<rect x="${w*step}" y="${d*step}" width="${cs}" height="${cs}" rx="3" fill="${c?'var(--accent)':'var(--surface-2)'}" opacity="${c?Math.min(1,.45+.3*c):1}"/>`}
 const lab=[0,13].map(w=>`<text x="${w*step}" y="${7*step+11}" class="ax">${fmtDate(addDays(start,w*7))}</text>`).join('')+`<text x="${weeks*step-g}" y="${7*step+11}" class="ax" text-anchor="end">This week</text>`;
 return `<svg class="heat" viewBox="0 0 ${weeks*step} ${7*step+14}" role="img" aria-label="Training days over the last 26 weeks">${r}${lab}</svg>`}
const hbars=(rows,fmt=v=>fmtNum(v,1))=>{const max=Math.max(1e-9,...rows.map(r=>r[1]));return `<div class="hbars">${rows.map(([l,v,c])=>`<div class="hbar" style="--c:${c||'var(--accent)'}"><span>${esc(l)}</span><span class="tr"><i style="width:${(v/max*100).toFixed(1)}%"></i></span><b>${fmt(v)}</b></div>`).join('')}</div>`};
function rangeStart(){const now=Date.now(),w=weekStart(now);if(ui.range==='4w')return addDays(w,-21);if(ui.range==='3m')return addDays(w,-7*12);if(ui.range==='1y')return addDays(w,-7*51);return S.sessions.length?weekStart(S.sessions[0].start):addDays(w,-21)}
function buckets(){const a=rangeStart(),now=Date.now();const weeks=Math.round((weekStart(now)-a)/(7*DAY))+1;const list=[];
 if(weeks<=27){for(let i=0;i<weeks;i++){const s=addDays(a,7*i);list.push({a:s,b:addDays(s,7),label:fmtDate(s,{day:'numeric',month:'short'})})}return{list,unit:'week',weeks}}
 let m=monthStart(a);while(m<=now){const d=new Date(m);const nx=new Date(d.getFullYear(),d.getMonth()+1,1).getTime();list.push({a:m,b:nx,label:d.getMonth()===0?String(d.getFullYear()).slice(2)+"'":fmtDate(m,{month:'short'})});m=nx}return{list,unit:'month',weeks}}
function chartCard(title,value,svg,legend=''){return `<div class="card"><div class="chead"><div class="h3">${title}</div>${value?`<span class="v">${value}</span>`:''}</div>${svg||'<p class="empty">Nothing logged in this range.</p>'}${legend}</div>`}
const legend=items=>`<div class="legend">${items.map(([l,c])=>`<span style="--c:${c}"><i></i>${esc(l)}</span>`).join('')}</div>`;
function bestWeeks(){const m=new Map();for(const s of S.sessions){const w=weekStart(s.start);const o=m.get(w)||{n:0,run:0,bike:0,t:0};const q=sMetrics(s);o.n++;o.run+=q.rd;o.bike+=q.bd;o.t+=s.duration||0;m.set(w,o)}
 const best=k=>{let bw=null,bv=0;for(const[w,o]of m)if(o[k]>bv){bv=o[k];bw=w}return bw?{w:bw,v:bv}:null};return{n:best('n'),run:best('run'),bike:best('bike'),t:best('t')}}
/* ================= PRs ================= */
function prRow(key,r,meta){const v=r&&r.best?prVal(r.unit,r.best.value):'—';return `<button class="prrow" data-act="${r?'go':'prAddKey'}" data-v="prDetail" data-key="${esc(key)}"><span style="font-weight:650">${esc((r||meta).label)}</span><span class="v ${r?'':'none'}">${v}</span>${r?`<span class="d">${fmtDateY(r.best.t)}${r.best.src==='manual'?' · added by you':''}</span>`:'<span class="d">Tap to add</span>'}</button>`}
function vPRsV2(){const m=computePRs();let body='';
 if(ui.prTab==='gym'){const groups=new Map();for(const k in m)if(m[k].group==='gym'){const n=k.split(':')[1];if(!groups.has(n))groups.set(n,[]);groups.get(n).push(m[k])}
  body=groups.size?[...groups.entries()].sort((a,b)=>a[1][0].ex.localeCompare(b[1][0].ex)).map(([n,rs])=>`<div class="list"><div class="prgroup"><span class="dot" style="--c:var(--gym)"></span>${esc(rs[0].ex)}</div>${GYM_METRICS.map(([mm])=>{const r=m[`g:${n}:${mm}`];return r?prRow(r.key,r):''}).join('')}</div>`).join(''):'<div class="card"><p class="muted sm">Gym records appear as soon as you log sets. You can also add older ones with Add.</p></div>'}
 else{const keys=ui.prTab==='run'?RUN_KEYS:BIKE_KEYS;body=`<div class="list">${keys.map(k=>prRow(k,m[k],keyMeta(k))).join('')}</div>`}
 const recent=Object.values(m).filter(r=>r.best&&r.best.src==='auto'&&Date.now()-r.best.t<30*DAY).length;
 return `<header class="hdr"><div><div class="eyebrow">${recent?plural(recent,'record')+' in the last 30 days':'Personal records'}</div><h1 class="h1">PRs</h1></div><button class="btn primary sm" data-act="prAddKey" data-key="">${ic('plus',16)} Add</button></header>
 ${seg([['gym','Gym'],['run','Running'],['bike','Cycling']],ui.prTab,'prTab')}
 ${body}
 <p class="hint">Records update by themselves when a logged workout beats them. Use Add to enter older records, for example from Strava. Running distances use the average pace of runs at least that long.</p>`}
function vPRDetail({key}){const r=computePRs()[key];const meta=r||keyMeta(key,exNames());const manual=S.prs.filter(p=>p.key===key).sort((a,b)=>b.t-a.t);
 const [b,u]=r?prBig(r.unit,r.best.value):['—',''];
 return `${topbar(meta.ex||'Record')}
 <div class="feat" style="cursor:default">${plateSVG}<span class="eyebrow">${esc((meta.ex?meta.ex+' · ':'')+meta.label)}</span><span class="feat-num" style="font-size:64px">${esc(b)}${u?`<span class="feat-unit">${esc(u)}</span>`:''}</span><span class="feat-sub">${r?`Set on ${fmtDateY(r.best.t)}${r.best.src==='manual'?' · added by you':''}`:'No record yet'}</span></div>
 ${r&&r.hist.length>1?chartCard('Progress','',lineChart({series:[{pts:r.hist.map(h=>({t:h.t,v:h.value})),color:'var(--accent)'}],fmt:v=>r.unit==='time'||r.unit==='pace'?fmtDur(v):fmtNum(v,1),invert:r.dir==='lo'})):''}
 ${r?`<div class="sec"><div class="h2">History</div></div><div class="list">${[...r.hist].reverse().map(h=>`<div class="li"><span class="grow"><span class="t">${prVal(r.unit,h.value)}</span><span class="s">${fmtDateY(h.t)}${h.note?' · '+esc(h.note):''}</span></span><span class="src">${h.src==='manual'?'Added':'Logged'}</span>${h.sid?`<button class="iconbtn sm" data-act="go" data-v="sdetail" data-id="${h.sid}" aria-label="Open workout">${ic('chev',18)}</button>`:''}</div>`).join('')}</div>`:''}
 ${manual.length?`<div class="sec"><div class="h2">Your entries</div></div><div class="list">${manual.map(e=>`<div class="li"><span class="grow"><span class="t">${prVal(meta.unit,e.value)}</span><span class="s">${fmtDateY(e.t)}${e.note?' · '+esc(e.note):''}</span></span><button class="btn sm danger" data-act="delPR" data-id="${e.id}" data-confirm="Delete?">Delete</button></div>`).join('')}</div>`:''}
 <button class="btn block" data-act="prAddKey" data-key="${esc(key)}">${ic('plus',18)} Add a record</button>`}
function prFormFor(key){const f={group:'run',key:'r:5k',ex:'',metric:'w',value:'',date:ymd(Date.now()),note:''};if(key){const k=key.split(':');if(k[0]==='g'){f.group='gym';f.ex=exNames().get(k[1])||k[1];f.metric=k[2]}else{f.group=k[0]==='r'?'run':'bike';f.key=key}}else if(ui.prTab==='gym')f.group='gym';else if(ui.prTab==='bike'){f.group='bike';f.key='b:long'}return f}
function vPRAdd(){const f=ui.prForm;const unit=f.group==='gym'?(GYM_METRICS.find(m=>m[0]===f.metric)||GYM_METRICS[0])[2]:keyMeta(f.key).unit;
 const vl={time:'Time (h:mm:ss)',pace:'Pace per km (m:ss)',km:'Distance (km)',kg:'Weight (kg)',reps:'Reps',m:'Elevation (m)','km/h':'Average speed (km/h)'}[unit];
 return `${topbar('Add record')}
 <p class="hint">Enter a record you set before using the app. It counts as your best until a logged workout beats it.</p>
 ${seg([['gym','Gym'],['run','Running'],['bike','Cycling']],f.group,'pfGroup')}
 ${f.group==='gym'?`<label class="field"><span>Exercise</span><input class="in" id="pf-ex" list="exnames" value="${esc(f.ex)}" data-b="pf|ex" placeholder="e.g. Bench Press" autocomplete="off"></label><label class="field"><span>Record</span><select class="in" id="pf-m" data-b="pf|metric" data-rr="1">${GYM_METRICS.map(([k,l])=>`<option value="${k}" ${f.metric===k?'selected':''}>${l}</option>`).join('')}</select></label>`:
 `<label class="field"><span>Record</span><select class="in" id="pf-k" data-b="pf|key" data-rr="1">${(f.group==='run'?RUN_KEYS:BIKE_KEYS).map(k=>`<option value="${k}" ${f.key===k?'selected':''}>${keyMeta(k).label}</option>`).join('')}</select></label>`}

function stepAt(e,path){const p=String(path).split('.').map(Number);let o=e.steps[p[0]];if(p.length>1)o=o.steps[p[1]];return o}
const UI_BINDS=['pf','ax','ah','fd','gf','bf','u'];
function setBound(el){const r=resolve(el.dataset.b);if(!r||!r[0])return;const[o,f]=r;const t=el.dataset.t||'text';let v=el.value;
 if(t==='num')v=num(v);else if(t==='km2m'){v=num(v);v=v===''?'':Math.round(v*1000)}else if(t==='int')v=parseInt(v,10)||0;else if(t==='dur')v=parseDur(v);else if(t==='dt'){const d=new Date(v).getTime();v=isFinite(d)?d:o[f]}
 o[f]=v;
 if(el.dataset.d){const x=S.active&&S.active.ex.find(z=>z.id===el.dataset.d);const dv=document.querySelector(`[data-dv="${el.dataset.d}"]`);if(x&&dv)dv.innerHTML=derivedHTML(x)}
 if(el.dataset.spl){const[eid,i]=el.dataset.spl.split('|');const x=S.active.ex.find(z=>z.id===eid);const a=document.querySelector(`[data-spd="${eid}|${i}"]`);if(a)a.innerHTML=splitInfo(x,+i);const b=document.querySelector(`[data-ssum="${eid}"]`);if(b)b.innerHTML=splitSumHTML(x)}
 if(el.dataset.pf){const a=el.dataset.b.split('|');const e=exOf(a[1],a[2],a[3]);const box=document.querySelector(`[data-prof="${el.dataset.pf}"]`);if(e&&box)box.outerHTML=profileBlock(e,e.cat,e.id)}
 if(el.dataset.ed){const a=el.dataset.b.split('|');const e=exOf(a[1],a[2],a[3]);const box=document.querySelector(`[data-edv="${el.dataset.ed}"]`);if(e&&box)box.innerHTML=tplDerived(e)}
 if(!UI_BINDS.includes(el.dataset.b.split('|')[0]))save()}
document.addEventListener('input',e=>{const el=e.target;if(el.dataset&&el.dataset.b)setBound(el)});
document.addEventListener('change',e=>{const el=e.target;if(el.type==='file'){handleFile(el);return}if(!el.dataset.b)return;setBound(el);if(el.dataset.rr){if(el.dataset.b.startsWith('p|')&&el.dataset.b.endsWith('seqPos')){const p=resolve(el.dataset.b)[0];p.seqDone=[];save()}if(el.dataset.b.startsWith('e|')&&el.dataset.b.endsWith('|cat')){const e=resolve(el.dataset.b)[0];fixTpl(e);if(e.cat==='gym'&&!e.sets.length)e.sets=[{r:10,w:'',t:''},{r:10,w:'',t:''},{r:10,w:'',t:''}];e.extra=e.extra.filter(k=>EXTRA_FOR[e.cat].includes(k));save()}render()}});
document.addEventListener('toggle',e=>{const d=e.target;if(d.dataset&&d.dataset.open){if(d.open)ui.open.add(d.dataset.open);else ui.open.delete(d.dataset.open)}},true);

/* images */
function readImage(file){return new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>{const img=new Image();img.onload=()=>{const max=900;const s=Math.min(1,max/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);c.getContext('2d').drawImage(img,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',0.8))};img.onerror=rej;img.src=fr.result};fr.onerror=rej;fr.readAsDataURL(file)})}
async function handleFile(el){const f=el.files&&el.files[0];if(!f)return;
 if(el.dataset.import){try{const txt=await f.text();stageImport(txt)}catch(e){toast('Could not read that file')}el.value='';return}
 if(el.dataset.stravafile){if(/\.zip$/i.test(f.name)){ui.stravaErr='That is the zip. Open it in the Files app first, then pick activities.csv from the folder it creates.';el.value='';render();return}try{const txt=await f.text();stageStravaFile(txt)}catch(e){toast('Could not read that file')}el.value='';return}
 if(el.dataset.img){try{const url=await readImage(f);const o=imgTarget(el.dataset.img);if(o){o.img=url;save();render()}}catch(e){toast('Could not load that image. Try a JPEG or PNG.')}}}
function stageImport(txt){try{const o=JSON.parse(txt);if(!o||!Array.isArray(o.plans)||!Array.isArray(o.sessions))throw 0;ui.pendingImport=o;render()}catch(e){toast(`That is not a ${APP} backup`)}}
function exportable(){const o={...S};delete o.active;delete o.sync;return o}

let wake=null;
async function grabWake(){try{if('wakeLock' in navigator&&!wake)wake=await navigator.wakeLock.request('screen')}catch(e){}}
function dropWake(){try{wake&&wake.release()}catch(e){}wake=null}
function openSession(){if(!S.active.past)grabWake();ui.sheet=null;if(ui.stack[ui.stack.length-1]?.v!=='session')go('session');else render()}
function newPlan(){const p={id:uid(),name:'New plan',img:'',mode:'week',created:Date.now(),workouts:[],days:[],seqPos:0,seqDone:[],closedThrough:weekStart(Date.now())};S.plans.push(p);if(!S.activePlanId)S.activePlanId=p.id;save();go('plan',{id:p.id})}
function tplRef(b){const a=b.split('|');return{p:planById(a[0]),w:wkOf(planById(a[0]),a[1]),e:exOf(a[0],a[1],a[2])}}
function stepArr(e,path){const p=String(path).split('.').map(Number);return p.length>1?{arr:e.steps[p[0]].steps,i:p[1]}:{arr:e.steps,i:p[0]}}
const curEx=d=>S.active.ex.find(z=>z.id===d.eid);
function syncTpl(x,field){if(!x.ref)return;const e=exOf(...x.ref);if(!e)return;e[field]=clone(x[field])}
function tomb(id){S.tomb[id]=Date.now()}

const GH='https://api.github.com',GIST_FILE='tempo-data.json',GIST_DESC='Tempo workout sync (do not rename)';
const SYNC_COLLS=['plans','sessions','prs','goals','body','weekSummaries','seqLog'];
const snap=new Map();let metaSnap='';
function stamp(init){const now=Date.now();for(const k of SYNC_COLLS)for(const it of S[k]||[]){const u=it.u;delete it.u;const j=JSON.stringify(it);it.u=u||0;if(init){snap.set(it.id,j);continue}if(snap.get(it.id)!==j){it.u=now;snap.set(it.id,j)}}const m=metaOf(S);if(init){metaSnap=m;return}if(m!==metaSnap){S.metaU=now;metaSnap=m}}
let mergeStates=function(L,R){const out={...L};const tb={...(R.tomb||{})};for(const k in L.tomb||{})tb[k]=Math.max(tb[k]||0,L.tomb[k]);
 for(const k of SYNC_COLLS){const m=new Map();for(const it of [...(R[k]||[]),...(L[k]||[])]){const e=m.get(it.id);if(!e||(it.u||0)>(e.u||0))m.set(it.id,it)}out[k]=[...m.values()].filter(it=>!(tb[it.id]>=(it.u||0)))}
 const ws=new Map();for(const w of out.weekSummaries){const key=w.planId+'|'+w.week;const e=ws.get(key);if(!e||(w.u||0)>(e.u||0))ws.set(key,w)}out.weekSummaries=[...ws.values()];
 out.sessions.sort((a,b)=>a.start-b.start);
 const src=(R.metaU||0)>(L.metaU||0)?R:L;out.activePlanId=src.activePlanId;out.settings=src.settings;out.metaU=Math.max(L.metaU||0,R.metaU||0);out.lastBackup=Math.max(L.lastBackup||0,R.lastBackup||0)||null;
 const ls=L.strava,rs=R.strava||emptyStrava(),ss=src===R?rs:ls;
 const imported={...rs.imported,...ls.imported};const ignored=[...new Set([...(rs.ignored||[]),...(ls.ignored||[])].map(String))].map(x=>isNaN(x)?x:Number(x));
 const pend=new Map();for(const a of [...(rs.pending||[]),...(ls.pending||[])])if(!imported[a.id]&&!ignored.includes(a.id))pend.set(String(a.id),pend.get(String(a.id))||a);
 out.strava=Object.assign({},ls,{clientId:ss.clientId,clientSecret:ss.clientSecret,access:ss.access,refresh:ss.refresh,expires:ss.expires,athlete:ss.athlete,auto:ss.auto,imported,ignored,pending:[...pend.values()],lastSync:Math.max(ls.lastSync||0,rs.lastSync||0),checked:Math.max(ls.checked||0,rs.checked||0)});
 const cut=Date.now()-180*DAY;for(const k in tb)if(tb[k]<cut)delete tb[k];out.tomb=tb;out.sample=false;out.active=L.active;out.sync=L.sync;return out};
async function gh(path,opt={}){const r=await fetch(GH+path,{...opt,headers:{Authorization:'Bearer '+S.sync.token,Accept:'application/vnd.github+json',...(opt.body?{'Content-Type':'application/json'}:{})}});
 if(r.status===401)throw new Error('GitHub no longer accepts the token. Turn sync off and on with a new token.');if(r.status===403||r.status===429)throw new Error('GitHub is limiting requests. Try again later.');if(!r.ok)throw new Error('GitHub error '+r.status);return r.status===204?null:r.json()}
async function findGist(){for(let page=1;page<=10;page++){const list=await gh(`/gists?per_page=100&page=${page}`);const g=list.find(x=>x.files&&x.files[GIST_FILE]);if(g)return g.id;if(list.length<100)break}return null}
async function readGist(id){const g=await gh('/gists/'+id);const f=g.files&&g.files[GIST_FILE];if(!f)return{data:null,text:''};let txt=f.content;if(f.truncated){const r=await fetch(f.raw_url);txt=await r.text()}try{return{data:JSON.parse(txt),text:txt}}catch(e){return{data:null,text:''}}}
async function writeGist(id,text){if(id){await gh('/gists/'+id,{method:'PATCH',body:JSON.stringify({description:GIST_DESC,files:{[GIST_FILE]:{content:text}}})});return id}
 const g=await gh('/gists',{method:'POST',body:JSON.stringify({description:GIST_DESC,public:false,files:{[GIST_FILE]:{content:text}}})});return g.id}
let syncP=null,syncSoonT=null;

function syncNow(){if(!S.sync.token||S.sample)return Promise.resolve();if(syncP)return syncP;if(!navigator.onLine){S.sync.err='Offline. It will sync when you are back online.';return Promise.resolve()}
 ui.syncing=true;softRender();
 syncP=(async()=>{try{let id=S.sync.gistId;if(id){try{await gh('/gists/'+id)}catch(e){if(/404/.test(e.message))id=''}}if(!id)id=await findGist();
   let remote={data:null,text:''};if(id)remote=await readGist(id);
   if(remote.data){const merged=mergeStates(S,migrate(remote.data));S=merged;stamp(true)}
   const text=JSON.stringify(exportable());if(text!==remote.text||!id)id=await writeGist(id,text);
   S.sync.gistId=id;S.sync.last=Date.now();S.sync.err='';closeWeeks()}
  catch(e){S.sync.err=e.message||'Could not reach GitHub'}
  finally{ui.syncing=false;syncP=null;await DB.set('state',clone(S));prCache=null;applyTheme();softRender()}})();
 return syncP}

const SV='https://www.strava.com';

function mapSport(t){const s=String(t||'');if(/Run/.test(s))return 'run';if(/Ride|Velomobile|Handcycle/.test(s))return 'bike';if(/WeightTraining|Crossfit/.test(s))return 'gym';return 'other'}
const sportName=s=>String(s||'Workout').replace(/([a-z])([A-Z])/g,'$1 $2');
async function stravaToken(params){const a=S.strava;const body=new URLSearchParams({client_id:String(a.clientId).trim(),client_secret:String(a.clientSecret).trim(),...params});
 let r;try{r=await fetch(SV+'/api/v3/oauth/token',{method:'POST',body})}catch(e){throw new Error('Could not reach Strava. Check your connection and try again.')}
 const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(r.status===400||r.status===401?'Strava did not accept the request. Check the Client ID and Secret, then connect again.':'Strava error '+r.status);
 a.access=j.access_token;a.refresh=j.refresh_token||a.refresh;a.expires=j.expires_at;if(j.athlete)a.athlete=[j.athlete.firstname,j.athlete.lastname].filter(Boolean).join(' ');save()}
async function stravaFresh(){if((S.strava.expires||0)-120>Date.now()/1000)return;await stravaToken({grant_type:'refresh_token',refresh_token:S.strava.refresh})}
async function sApi(path){await stravaFresh();let r;try{r=await fetch(SV+'/api/v3'+path,{headers:{Authorization:'Bearer '+S.strava.access}})}catch(e){throw new Error('Could not reach Strava. Check your connection.')}
 if(r.status===401)throw new Error('Strava access has expired or was revoked. Disconnect and connect again.');if(r.status===429)throw new Error('Strava rate limit reached. Try again in 15 minutes.');if(!r.ok)throw new Error('Strava error '+r.status);return r.json()}
async function stravaFinish(code){ui.stravaBusy=true;ui.stravaErr='';render();

 catch(e){ui.stravaErr=e.message;ui.stravaBusy=false;render()}}
function stravaReturn(){const q=new URLSearchParams(location.search);if(!q.has('code')&&!q.has('error'))return null;const o={code:q.get('code'),error:q.get('error'),scope:q.get('scope')||'',state:q.get('state')};history.replaceState(null,'',location.pathname);return o}
async function handleStravaReturn(o){ui.stack=[{v:'settings'},{v:'strava'}];
 if(o.error){ui.stravaErr='Strava access was not granted.';render();return}

function suggestMatch(a){const p=activePlan();if(!p||a.cat==='other')return '';const same=w=>typeKey(w)===a.cat;let cands=[];
 if(p.mode==='week'){const done=weekDone(p,weekStart(a.start));cands=p.workouts.filter(w=>same(w)&&!done.has(w.id))}else{const cd=seqDay(p);cands=cd?cd.day.w.map(id=>wkOf(p,id)).filter(w=>w&&same(w)):[]}
 if(!cands.length)return '';const nm=norm(a.name);const isStruct=w=>w.exercises.some(e=>e.mode==='struct');const looksInt=/interval|track|repeat|fartlek|tempo|\d\s?[x×]\s?\d/.test(nm);const w=cands.find(w=>nm.includes(norm(w.name)))||cands.find(w=>looksInt===isStruct(w))||cands[0];return p.id+'|'+w.id}
async function stravaCheck(silent){const a=S.strava;if(!a.access||ui.stravaBusy)return;ui.stravaBusy=true;ui.stravaErr='';if(!silent)render();
 try{let page=1,added=0,newest=a.lastSync||0;const after=a.lastSync||Math.floor((Date.now()-30*DAY)/1000);
  while(page<=40){const list=await sApi(`/athlete/activities?after=${after}&per_page=100&page=${page}`);
   for(const x of list){const t=Math.floor(Date.parse(x.start_date)/1000);newest=Math.max(newest,t);if(a.imported[x.id]||a.ignored.includes(x.id)||a.pending.some(p=>String(p.id)===String(x.id)))continue;const sp=x.sport_type||x.type;
    a.pending.push({id:x.id,name:x.name||sportName(sp),sport:sportName(sp),cat:mapSport(sp),start:Date.parse(x.start_date),distance:x.distance||0,moving:x.moving_time||0,elapsed:x.elapsed_time||0,elev:x.total_elevation_gain||0,hr:x.average_heartrate||'',maxhr:x.max_heartrate||'',cad:x.average_cadence||'',watts:x.average_watts||'',kcal:x.kilojoules?Math.round(x.kilojoules):''});added++}
   if(list.length<100)break;page++}
  a.pending.sort((x,y)=>x.start-y.start);a.lastSync=newest;a.checked=Date.now();save();
  if(a.auto){for(const p of [...a.pending].filter(p=>p.cat!=='gym'))await importStrava(p,suggestMatch(p))}
  if(!silent)toast(added?`${plural(added,'new activity').replace('activitys','activities')} from Strava`:'No new activities')}
 catch(e){ui.stravaErr=e.message;if(!silent)toast(e.message)}
 finally{ui.stravaBusy=false;softRender();if(!silent)render()}}
function buildStravaSession(a,choice){let s=null;if(choice){const[pid,wid]=String(choice).split('|');const p=planById(pid),w=wkOf(p,wid);if(p&&w)s=newSession(p,w,true)}
 if(!s){s=newAdhoc(a.name,a.cat,true);if(a.cat==='other'&&!s.ex.length)s.ex=[blankEx(a.name,'other')];if(a.cat==='other'&&s.type!=='custom'){s.type='custom';s.customName=a.sport}}
 else if(a.name&&norm(a.name)!==norm(s.name))s.notes=a.name;
 if(a.desc&&!s.notes)s.notes=a.desc;
 s.start=a.start;s.duration=a.elapsed||a.moving||0;s.source='strava';s.stravaId=a.id;
 let x=null;
 if(a.cat!=='gym'){x=s.ex.find(z=>z.cat===a.cat);if(!x){x=blankEx(a.name,a.cat);s.ex.unshift(x)}s.ex=[x];
  if(a.cat==='other'){x.time=a.moving||a.elapsed||'';if(a.distance){x.vals.dist=Math.round(a.distance/10)/100;if(!x.extra.includes('dist'))x.extra.push('dist')}}
  else{x.dist=a.distance?Math.round(a.distance/10)/100:'';x.time=a.moving||a.elapsed||'';if(a.cat==='bike')x.elev=a.elev?Math.round(a.elev):''}
  const vals={hr:a.hr,maxhr:a.maxhr,cad:a.cat==='run'&&a.cad?a.cad*2:a.cad,power:a.watts,kcal:a.kcal,elev:a.cat==='run'?a.elev:''};
  for(const k in vals){const v=num(vals[k]);if(v>0&&EXTRA_FOR[x.cat].includes(k)){x.vals[k]=Math.round(v);if(!x.extra.includes(k))x.extra.push(k)}}}
 return{s,x}}
async function importStrava(a,choice){const{s,x}=buildStravaSession(a,choice);
 if(x&&x.flat&&S.strava.access){try{const laps=await sApi(`/activities/${a.id}/laps`);if(Array.isArray(laps)&&laps.length===x.flat.length)x.flat.forEach((q,i)=>{const L=laps[i];if(q.by==='dist')x.splits[i].t=L.moving_time||L.elapsed_time;else x.splits[i].m=Math.round(L.distance)})}catch(e){}}
 S.strava.pending=S.strava.pending.filter(p=>String(p.id)!==String(a.id));S.strava.imported[a.id]=s.id;

function parseCSV(t){const first=t.slice(0,t.indexOf('\n')>0?t.indexOf('\n'):t.length);const sep=(first.split(';').length>first.split(',').length)?';':',';
 const rows=[];let row=[],f='',q=false;for(let i=0;i<t.length;i++){const ch=t[i];if(q){if(ch==='"'){if(t[i+1]==='"'){f+='"';i++}else q=false}else f+=ch}else if(ch==='"')q=true;else if(ch===sep){row.push(f);f=''}else if(ch==='\n'){row.push(f);rows.push(row);row=[];f=''}else if(ch!=='\r')f+=ch}
 if(f!==''||row.length){row.push(f);rows.push(row)}return rows}

function nameOf(s){let n=s.replace(/[:–—]+.*$/,'');const i=n.search(/\s\d|\s[x×]\s?\d|@/);if(i>0)n=n.slice(0,i);return n.replace(/[-–—,:;]+$/,'').trim()}
function parseExLine(line){const s=line.replace(/^\s*(?:[-•*]|\d+[.)])\s*/,'').trim();if(!s)return null;const low=s.toLowerCase();
 const mi=low.match(/(\d+)\s*[x×]\s*(\d+(?:[.,]\d+)?)\s*(m|km)\b/);
 if(mi){const n=+mi[1];let meters=num(mi[2])*(mi[3]==='km'?1000:1);const pace=s.match(/(\d{1,2}:\d{2}(?:\s*[-–]\s*\d{1,2}:\d{2})?)/);const rest=low.match(/(?:rest|rec|recover|descanso|recuperação)\D{0,6}(\d+)\s*(s|sec|seg|min|m)\b/);const rs=rest?(/^(s|sec|seg)$/.test(rest[2])?+rest[1]:(+rest[1]<=10?+rest[1]*60:+rest[1])):90;
  const cat=/ride|bike|cycl|bicicleta|ciclismo/.test(low)?'bike':'run';const steps=[st('warm','time',600,cat==='run'?'Z1':'Zone 2'),rep(n,[st('work','dist',meters,pace?pace[1]:''),st('rec','time',rs,'')]),st('cool','time',600,cat==='run'?'Z1':'Zone 1')];
  return{name:nameOf(s)||'Intervals',cat,mode:'struct',steps}}
 const km=low.match(/(\d+(?:[.,]\d+)?)\s*km\b/);const pace=s.match(/(\d{1,2}:\d{2}(?:\s*[-–]\s*\d{1,2}:\d{2})?)/);const mn=low.match(/(\d+)\s*(min|mins|minutes|minutos|')\b/);
 const isRun=/run|corrida|jog|easy|tempo|long run|trote|correr/.test(low),isBike=/ride|bike|cycl|bicicleta|ciclismo|spin/.test(low);
 if((isRun||isBike)&&(km||mn||pace))return{name:nameOf(s)||(isBike?'Ride':'Run'),cat:isBike?'bike':'run',dist:km?num(km[1]):'',time:mn&&!km?(+mn[1])*60:'',tgt:pace?pace[1]:''};
 let sets=null;let m=low.match(/(\d+)\s*[x×]\s*(\d+|max|f|amrap|failure|falha)(?:\s*[-–]\s*(\d+))?/);
 if(m){const n=Math.min(12,+m[1]);const r=m[2];sets=Array.from({length:n},()=>/\d/.test(r)?{r:+r,w:'',t:''}:{r:'',w:'',t:'f'})}
 else{const l=low.match(/(\d+(?:\s*[,/]\s*\d+)+)/);if(l&&!/kg/.test(l[1]))sets=l[1].split(/[,/]/).map(x=>({r:+x.trim(),w:'',t:''}))}
 const w=low.match(/(\d+(?:[.,]\d+)?)\s*kg/)||low.match(/@\s*(\d+(?:[.,]\d+)?)(?!\s*:)/)||low.match(/\d+\s*[x×]\s*\d+\s+(\d+(?:[.,]\d+)?)\s*$/);
 if(sets){if(w)sets.forEach(z=>z.w=num(w[1]));return{name:nameOf(s),cat:'gym',sets}}
 if(mn)return{name:nameOf(s)||s,cat:'other',time:(+mn[1])*60};
 return{name:s.replace(/[:–—]+$/,'').trim(),cat:'gym',sets:[{r:10,w:'',t:''},{r:10,w:'',t:''},{r:10,w:'',t:''}],guess:true}}
function parsePlanText(text){const lines=String(text||'').split(/\r?\n/).map(l=>l.trim());const ws=[];let cur=null;
 const isHeader=(l,next)=>{if(!l)return false;if(/^#+\s*/.test(l)||/:\s*$/.test(l))return true;if(/^(day|dia|workout|treino|session|sessão|semana|week)\s*[\w\d]*\s*[:\-–—]?\s*\S*$/i.test(l)&&!/\d+\s*[x×]/.test(l))return true;if(WEEKDAYS.test(l)&&!/\d+\s*[x×]/.test(l))return true;if(!/\d/.test(l)&&l.length<32&&next&&/\d/.test(next))return true;return false};
 for(let i=0;i<lines.length;i++){const l=lines[i];if(!l)continue;let next='';for(let j=i+1;j<lines.length;j++)if(lines[j]){next=lines[j];break}

  if(x.flat&&(x.dist===''||x.time==='')){const q=splitSum(x);if(q.c){if(x.dist==='')x.dist=Math.round(q.m/10)/100;if(x.time==='')x.time=q.t}}delete x.tgt;delete x.sug;return x}).filter(x=>x.cat!=='gym'||x.sets.length);
 const editId=s.editId;delete s.past;delete s.editId;
 const before=editId||!celebrate?null:computePRs();const achB=editId||!celebrate?null:new Set(achievements().filter(a=>a.at).map(a=>a.id));
 if(editId){s.id=editId;const i=S.sessions.findIndex(z=>z.id===editId);if(i>=0)S.sessions[i]=s;else S.sessions.push(s)}else S.sessions.push(s);
 S.sessions.sort((x,y)=>x.start-y.start);
 if(!editId){const p=planById(s.planId);if(p&&p.mode==='seq'&&p.id===S.activePlanId){const cd=seqDay(p);if(cd&&cd.day.w.includes(s.workoutId)){p.seqDone=[...new Set([...(p.seqDone||[]),s.workoutId])];if(cd.day.w.every(id=>p.seqDone.includes(id)))seqAdvance(p,'done')}}}

 const ach=achB?achievements().filter(a=>a.at&&!achB.has(a.id)):[];
 return{s,news,editId,ach}}

function chValue(kind,a,b){const ss=sessionsIn(a,b);if(kind==='workouts')return ss.length;if(kind==='days')return new Set(ss.map(s=>ymd(s.start))).size;if(kind==='hours')return ss.reduce((t,s)=>t+(s.duration||0),0)/3600;if(kind==='runKm')return ss.reduce((t,s)=>t+sMetrics(s).rd,0);if(kind==='bikeKm')return ss.reduce((t,s)=>t+sMetrics(s).bd,0);if(kind==='sets')return ss.reduce((t,s)=>t+sMetrics(s).sets,0);return 0}
function chSuggest(){const now=Date.now(),m=monthStart(now),pm=addMonths(m,-1);const out=[];const nice=v=>v>=100?Math.round(v/10)*10:v>=20?Math.round(v/5)*5:Math.max(1,Math.round(v));
 for(const k of Object.keys(CH_KIND)){const last=chValue(k,pm,m);const base=last>0?last*1.1:{workouts:12,runKm:50,bikeKm:200,days:12,hours:10,sets:120}[k];if(k==='runKm'&&!S.sessions.some(s=>typeKey(s)==='run'))continue;if(k==='bikeKm'&&!S.sessions.some(s=>typeKey(s)==='bike'))continue;if(k==='sets'&&!S.sessions.some(s=>typeKey(s)==='gym'))continue;out.push({kind:k,target:nice(base),last})}return out}

function vRace(){const h=vRaceV3();const r=S.race;if(!r)return h;const g=parseDur(r.goal),d=num(r.dist);if(!(g>0&&d>0))return h+`<p class="hint">Add a goal time to see a pacing plan.</p>`;

 let accE=0,accN=0;const rows=ks.map((k,i)=>{const seg=k-(ks[i-1]||0);accE+=pace*seg;accN+=neg(k-seg/2)*seg;return [k,accE,neg(k-seg/2),accN]});const step=Math.max(1,Math.ceil(rows.length/12));

 const days=Array.from({length:7},(_,i)=>{const t=addDays(ws,i),d=ymd(t);const done=sessionsIn(t,addDays(t,1));const pl=schedOn(d);return `<div class="pday ${d===today?'today':''}"><div class="pdh"><b>${fmtDate(t,{weekday:'short'})}</b><span>${new Date(t).getDate()}</span></div><div class="pdc">${pl.map(x=>{const p=planById(x.pid),w=wkOf(p,x.wid);if(!w)return '';const ok=schedDone(x);return `<button class="pchip ${ok?'ok':''}" style="--c:var(--${typeKey(w)})" data-act="plChip" data-id="${x.id}">${ok?ic('check',12):ic(typeKey(w),12)} ${esc(w.name)}</button>`}).join('')}${done.filter(s=>!pl.some(x=>x.wid===s.workoutId)).map(s=>`<span class="pchip done" style="--c:var(--${typeKey(s)})">${ic('check',12)} ${esc(s.name)}</span>`).join('')}<button class="pchip add" data-act="plPick" data-d="${d}" aria-label="Add to ${fmtDate(t,{weekday:'long'})}">${ic('plus',13)}</button></div></div>`}).join('');
 return `${topbar('Planner')}<div class="calnav"><button class="iconbtn sm" data-act="plWeek" data-n="-1" aria-label="Previous week">${ic('back',18)}</button><div style="text-align:center"><div class="h3">${off===0?'This week':off===1?'Next week':off===-1?'Last week':'Week of '+fmtDate(ws)}</div><div class="muted xs">${fmtDate(ws)} – ${fmtDate(addDays(ws,6))}</div></div><button class="iconbtn sm" data-act="plWeek" data-n="1" aria-label="Next week">${ic('chev',18)}</button></div>

function vMobility(){return `${topbar('Mobility')}<h1 class="h1">Mobility</h1><p class="muted">Follow along with a timer. Finishing logs it as an activity.</p>${ROUTINES.map(r=>`<button class="card" style="width:100%" data-act="mobStart" data-id="${r.id}"><div class="sec" style="margin:0"><div><div class="h3" style="font-size:17px">${esc(r.name)}</div><span class="muted xs">${r.min} min · ${plural(r.moves.length,'move')}</span></div><span class="lt" style="--c:var(--other)">${ic('play',16)}</span></div><span class="muted sm">${r.moves.slice(0,4).map(m=>m[0]).join(' · ')}…</span></button>`).join('')}`}
function vPlayer(){const m=ui.mob;if(!m)return topbar('Mobility');const r=ROUTINES.find(x=>x.id===m.id);const mv=r.moves[m.i];const nx=r.moves[m.i+1];const tot=r.moves.reduce((a,b)=>a+b[1],0);const doneS=r.moves.slice(0,m.i).reduce((a,b)=>a+b[1],0);
 return `${topbar(r.name)}<div class="player"><div class="eyebrow">${m.i+1} of ${r.moves.length}</div><h1 class="h1" style="text-align:center">${esc(mv[0])}</h1><div class="ring huge" style="color:var(--other)"><svg viewBox="0 0 76 76"><circle cx="38" cy="38" r="33" fill="none" stroke="var(--surface-2)" stroke-width="3"/><circle id="mpring" cx="38" cy="38" r="33" fill="none" stroke="var(--other)" stroke-width="3" stroke-linecap="round" pathLength="100" stroke-dasharray="0 100"/></svg><b><span id="mpt">${fmtDur(mv[1])}</span></b></div>

function vLive(){const lv=ui.lv;const a=S.active;const x=a&&lv&&a.ex.find(z=>z.id===lv.eid);if(!x)return topbar('Interval timer')+'<p class="muted">No interval workout open.</p>';const q=x.flat[lv.i];const nx=x.flat[lv.i+1];const cat=x.cat;const pr=cat==='run'?parsePace(q.tgt):null;

 <div class="livebig num" id="lvt">0:00</div><div class="muted" id="lvsub">${q.by==='dist'?`${fmtM(q.v,cat)} · tap Lap at the end`:`${fmtDur(q.v)} · moves on by itself`}</div>

 <div class="profile" style="width:100%">${profileSVG(x.flat,cat).replace('<svg ','<svg id="lvprof" ')}</div>
 <p class="muted">${nx?`Next: ${esc(kindLabel(nx.kind,cat))} · ${nx.by==='dist'?fmtM(nx.v,cat):fmtDur(nx.v)}${nx.tgt?' · '+esc(nx.tgt):''}`:'Last step'}</p>
 <button class="btn primary xl" data-act="liveLap">${q.by==='dist'?ic('flag',18)+' Lap':ic('skip',18)+' Next step'}</button>
 <div class="fnav" style="width:100%"><button class="btn line" data-act="livePause">${lv.paused?ic('play',16)+' Resume':ic('pause',16)+' Pause'}</button><button class="btn line" data-act="liveBack" ${lv.i===0?'disabled':''}>${ic('back',16)} Back a step</button></div>
 <p class="hint" style="text-align:center">Each lap time goes into the workout's splits.</p></div>`}
function vRMTest(){const t=ui.rm||(ui.rm={ex:'Bench Press',est:'',i:-1,res:[]});if(t.i<0){const pr=computePRs()[`g:${norm(t.ex)}:1rm`];return `${topbar('1RM test')}<h1 class="h1">1RM test</h1><p class="muted">A guided climb to your one-rep max: warm-up sets, then single attempts. Rest 3–5 minutes between attempts and use a spotter or safety bars.</p>
 <div class="card"><label class="field"><span>Exercise</span><input class="in" id="rm-x" list="exnames" value="${esc(t.ex)}" data-b="rm|ex" autocomplete="off"></label><label class="field"><span>Your estimated 1RM (kg)</span><input class="in big" id="rm-e" inputmode="decimal" value="${esc(t.est)}" data-b="rm|est" data-t="num" placeholder="${pr?fmtNum(pr.best.value,1)+' from your records':'e.g. 100'}"></label>
 <button class="btn primary" data-act="rmBegin">Start the test</button></div>`}
 const plan=rmPlan(t);const s=plan[t.i];if(!s){const best=Math.max(0,...t.res.filter(r=>r.ok&&r.att).map(r=>r.w));return `${topbar('1RM test')}<div class="sumhero card"><div class="eyebrow">${esc(t.ex)}</div><h1 class="h1">${best?fmtNum(best,2)+' kg':'No attempt made'}</h1><p class="muted">${best?'Your tested one-rep max.':'Try again another day with a lower start.'}</p></div><button class="btn primary xl" data-act="rmSave">Save to history</button><button class="btn line block" data-act="rmReset">Start over</button>`}
 return `${topbar('1RM test')}<div class="fdots">${plan.map((q,i)=>`<i class="${i<t.i?'done':i===t.i?'cur':''}"></i>`).join('')}</div><div class="player"><div class="eyebrow">${s.att?`Attempt ${s.att}`:'Warm-up'}</div><div class="livebig num">${fmtNum(s.w,2)}<span class="feat-unit"> kg</span></div><div class="muted">× ${s.r} ${s.r===1?'rep':'reps'} · ${Math.round(s.p*100)}%</div>
 <button class="btn line sm" data-act="platesSheet" data-w="${s.w}">${ic('plate',14)} Plates</button>
 ${s.att?`<div class="fnav" style="width:100%"><button class="btn primary xl" data-act="rmRes" data-ok="1">Made it</button><button class="btn line xl" data-act="rmRes" data-ok="0">Missed</button></div>`:`<button class="btn primary xl" data-act="rmRes" data-ok="1">Done</button>`}</div>`}
function rmPlan(t){const e=num(t.est)||100;const r25=v=>Math.round(v/2.5)*2.5;const plan=[[.4,8],[.6,5],[.75,3],[.85,1],[.92,1]].map(([p,r])=>({w:r25(e*p),r,p}));let n=0;const atts=[];for(const res of t.res.filter(r=>r.att)){atts.push(res)}
 const a1={w:r25(e*.97),r:1,p:.97,att:1};plan.push(a1);const r1=t.res.find(r=>r.att===1);if(r1){const p2=r1.ok?1.01:.95;plan.push({w:r25(e*p2),r:1,p:p2,att:2});const r2=t.res.find(r=>r.att===2);if(r2&&r2.ok){const p3=r1.ok?1.04:1;plan.push({w:r25(e*p3),r:1,p:p3,att:3})}}return plan}
function vYear(){const y=ui.yr||new Date().getFullYear();const a=new Date(y,0,1).getTime(),b=new Date(y+1,0,1).getTime();const ss=sessionsIn(a,b);const m=periodMetrics(a,b);const months=Array.from({length:12},(_,i)=>{const s=new Date(y,i,1).getTime(),e=new Date(y,i+1,1).getTime();return sessionsIn(s,e).length});
 let lr=0,lb=0;const ex=new Map();for(const s of ss)for(const x of s.ex){if(x.cat==='run')lr=Math.max(lr,num(x.dist)||0);if(x.cat==='bike')lb=Math.max(lb,num(x.dist)||0);if(x.cat==='gym'){const k=norm(x.name);const e=ex.get(k)||{name:x.name,n:0};e.n++;ex.set(k,e)}}
 const top=[...ex.values()].sort((p,q)=>q.n-p.n).slice(0,5);const bm=months.indexOf(Math.max(...months));const types={};for(const s of ss)types[typeKey(s)]=(types[typeKey(s)]||0)+1;const years=[...new Set(S.sessions.map(s=>new Date(s.start).getFullYear()))].sort();

 <div class="tiles"><div class="tile"><b>${fmtNum(m.run,0)}<small>km</small></b><span>running</span></div><div class="tile"><b>${fmtNum(m.bike,0)}<small>km</small></b><span>cycling</span></div><div class="tile"><b>${fmtNum(m.vol/1000,0)}<small>t</small></b><span>lifted</span></div><div class="tile"><b>${m.prs}</b><span>records</span></div><div class="tile"><b>${fmtNum(lr,1)}<small>km</small></b><span>longest run</span></div><div class="tile"><b>${fmtNum(lb,0)}<small>km</small></b><span>longest ride</span></div></div>
 ${chartCard('Workouts by month',m.n?`Best: ${fmtDate(new Date(y,bm,1).getTime(),{month:'long'})}`:'',m.n?barChart({labels:'JFMAMJJASOND'.split(''),series:[{color:'var(--accent)',values:months}],fmt:v=>fmtNum(v,0),int:true}):'')}

/* --- interval timer --- */
let lvT=null;
function lvElapsed(){const lv=ui.lv;if(!lv)return 0;return ((lv.paused?lv.paused:Date.now())-lv.t0-lv.pz)/1000}
function lvTick(){const lv=ui.lv;if(!lv||ui.stack[ui.stack.length-1]?.v!=='live')return;const x=S.active&&S.active.ex.find(z=>z.id===lv.eid);if(!x){stopLive();return}const q=x.flat[lv.i];const el=lvElapsed();const t=$('#lvt');
 if(q.by==='time'){const left=Math.max(0,num(q.v)-el);if(t)t.textContent=fmtDur(Math.ceil(left));const s=Math.ceil(left);if(!lv.paused&&s<=3&&s>0&&lv.last!==s){lv.last=s;beep(660,.08)}if(!lv.paused&&left<=0){liveAdvance(false);return}}
 else{if(t)t.textContent=fmtDur(el);const pr=x.cat==='run'?parsePace(q.tgt):null;const sub=$('#lvsub');if(sub&&pr&&el>0){const lo=pr[0]*q.v/1000,hi=pr[1]*q.v/1000;sub.innerHTML=`${fmtM(q.v,x.cat)} · ${el<lo?'ahead of':el<=hi?'on':'behind'} target`}}
 const pf=$('#lvprof');if(pf){pf.querySelectorAll('rect').forEach((r,i)=>r.setAttribute('opacity',i<lv.i?.35:i===lv.i?1:.6))}}
function liveAdvance(lap){const lv=ui.lv;const x=S.active.ex.find(z=>z.id===lv.eid);const q=x.flat[lv.i];const el=Math.round(lvElapsed());
 if(q.by==='dist'&&lap)x.splits[lv.i].t=el;
 lv.i++;lv.t0=Date.now();lv.pz=0;lv.paused=null;lv.last=null;beep(990,.2,.25);buzz([120,60,120]);save();
 if(lv.i>=x.flat.length){stopLive();const q2=splitSum(x);if(q2.c){x.dist=Math.round(q2.m/10)/100;x.time=q2.t}save();ui.stack.pop();render();toast('Intervals done. Splits saved.');return}render()}
function stopLive(){clearInterval(lvT);lvT=null}
/* --- mobility player --- */
let mpT=null;
function mpTick(){const m=ui.mob;if(!m||ui.stack[ui.stack.length-1]?.v!=='mplay')return;const r=ROUTINES.find(x=>x.id===m.id);const mv=r.moves[m.i];const el=((m.paused||Date.now())-m.t0-m.pz)/1000;const left=Math.max(0,mv[1]-el);
 const t=$('#mpt');if(t)t.textContent=fmtDur(Math.ceil(left));const rg=$('#mpring');if(rg)rg.setAttribute('stroke-dasharray',`${(Math.min(1,el/mv[1])*100).toFixed(2)} 100`);
 const s=Math.ceil(left);if(!m.paused&&s<=3&&s>0&&m.last!==s){m.last=s;beep(660,.07)}if(!m.paused&&left<=0)mpNext()}
function mpNext(){const m=ui.mob;const r=ROUTINES.find(x=>x.id===m.id);m.done+=(((m.paused||Date.now())-m.t0-m.pz)/1000);m.i++;m.t0=Date.now();m.pz=0;m.paused=null;m.last=null;beep(990,.2,.25);buzz(150);
 if(m.i>=r.moves.length){clearInterval(mpT);mpT=null;const s=newAdhoc('Mobility','other',true);s.start=m.start;s.duration=Math.round(m.done);s.ex=[Object.assign(blankEx(r.name,'other'),{time:Math.round(m.done),desc:r.moves.map(x=>x[0]).join(', ')})];s.type='custom';s.customName='Mobility';commitSession(s,{celebrate:false});ui.mob=null;ui.stack=[];ui.tab='home';render();toast(`${r.name} done and logged`);return}render()}
/* --- tempo metronome --- */
let tmT=null;
function tmTick(){const t=ui.tm;if(!t||!t.run||!ui.sheet||ui.sheet.t!=='tempo'){clearInterval(tmT);tmT=null;return}const cyc=t.parts.reduce((a,b)=>a+b,0)||1;const el=(Date.now()-t.t0)/1000;const reps=Math.floor(el/cyc);const inC=el-reps*cyc;let acc=0,ph=0;for(let i=0;i<4;i++){if(inC<acc+t.parts[i]){ph=i;break}acc+=t.parts[i]}
 const names=['Down','Pause','Up','Pause'];if(t.ph!==ph||t.reps!==reps){if(t.parts[ph]>0)beep(ph===2?880:ph===0?520:700,.06,.15);t.ph=ph;t.reps=reps}
 const n=$('#tmn'),p=$('#tmph'),b=$('#tmbar');if(n)n.textContent=reps;if(p)p.textContent=names[ph]+(t.parts[ph]?` · ${t.parts[ph]}s`:'');if(b){const f=t.parts[ph]?(inC-acc)/t.parts[ph]:1;const pos=ph===0?f:ph===1?1:ph===2?1-f:0;b.style.height=(pos*100).toFixed(1)+'%'}}

const NOGEAR=new Set(['settings','visual','appearance','backup','session','summary','live','mplay','onboard']);
function addGear(h,top){const g=`<button class="gearbtn" data-act="go" data-v="settings" aria-label="Settings">${ic('cog',19)}</button>`;
 if(top){if(NOGEAR.has(top.v))return h;return h.replace('<div class="tb-right"></div>',`<div class="tb-right">${g}</div>`)}
 return `<div class="gearfix">${g}</div>`+h}

/* --- settings hub --- */
const setRow=(act,icon,t,s,extra='',c='var(--muted)',q='')=>`<button class="li srow2" data-act="${act}" ${extra} data-q="${esc((t+' '+s+' '+q).toLowerCase())}"><span class="lt" style="--c:${c}">${ic(icon,18)}</span><span class="grow"><span class="t">${t}</span>${s?`<span class="s">${s}</span>`:''}</span><span class="chev">${ic('chev',18)}</span></button>`;
const setTog=(on,k,t,s,q='')=>`<div class="li srow2 stog" data-q="${esc((t+' '+s+' '+q).toLowerCase())}"><span class="grow"><span class="t">${t}</span>${s?`<span class="s">${s}</span>`:''}</span><button class="switch ${on?'on':''}" data-act="togSet" data-k="${k}" role="switch" aria-checked="${!!on}" aria-label="${esc(t)}"><span class="knob"></span></button></div>`;
const setGroup=(t,rows)=>`<section class="sgroup"><div class="sgt">${t}</div><div class="list">${rows.join('')}</div></section>`;
function vSettings(){const st=S.settings;const f=featValue(st.featured);
 return `${topbar('Settings')}<h1 class="h1">Settings</h1>
 <input class="in" id="ssearch" type="search" placeholder="Search settings" data-live="settings" autocomplete="off">
 ${setGroup('Account and sync',[
  setRow('go','sync','Sync between devices',esc(syncLabel()),'data-v="sync"',S.sync.token?(S.sync.err?'var(--bad)':'var(--ok)'):'var(--muted)','gist github backup cloud'),
  setRow('go','link','Strava',S.strava.access?'Connected':'Import your history','data-v="strava"','#FC4C02','import activities')])}
 ${setGroup('Look and feel',[
  setRow('go','sliders','Visual customization',esc(visSummary()),'data-v="visual"','var(--accent)','theme style colour color accent font typeface corners background dark'),
  setRow('go','home','Customize Today','Cards, order and size','data-v="customize"','var(--accent)','widgets home'),
  setRow('featSheet','star','Highlighted stat',esc(f.label),'','var(--accent)','featured streak big number'),
  setTog(st.fab!==false,'fab','Quick-log button','The floating + on Today','fab plus')])}
 ${setGroup('Workouts',[
  setTog(st.focusDefault!==false,'focusDefault','Start in focus mode','One exercise at a time. Off shows the full list','list view'),
  setTog(st.sound!==false,'sound','Rest timer sound','A beep when rest ends','audio beep'),
  setTog(st.haptics!==false,'haptics','Vibration','On set done and when rest ends','haptic buzz'),
  `<label class="li srow2 stog" data-q="weight step increment progression kg suggestions"><span class="grow"><span class="t">Weight step</span><span class="s">Used for weight suggestions</span></span><input class="in mini" id="set-inc" inputmode="decimal" value="${esc(st.inc)}" data-b="set|inc" data-t="num"><span class="muted sm">kg</span></label>`,
  setTog(st.dailyAsk!==false,'dailyAsk','Morning check-in','Ask how I feel the first time I open the app each day','sleep readiness')])}
 ${setGroup('Training setup',[
  setRow('go','sliders','Set up my plan','Three questions, then a plan','data-v="onboard"','var(--muted)','onboarding'),
  setRow('go','gauge','Training zones','Pace and heart rate','data-v="zones"','var(--muted)','hr'),
  setRow('go','flag','Race',S.race&&S.race.date?esc(S.race.name||'Race'):'Countdown and predicted time','data-v="race"'),
  setRow('go','shoe','Shoes and bikes','Kilometres per pair','data-v="gear"'),
  setRow('go','bandage','Injuries',activeInj().length?plural(activeInj().length,'active injury','active injuries'):'Nothing tracked','data-v="injuries"')])}
 ${setGroup('Data',[
  setRow('go','download','Backup and restore',S.lastBackup?'Last backup '+fmtDate(S.lastBackup):'No backup file yet','data-v="backup"','var(--muted)','export import json file erase delete reset'),
  setRow('go','link','Import from Strava','activities.csv from your archive','data-v="strava"')])}
 ${setGroup('Help',[
  setRow('tourStart','school','Interactive tutorial','A guided tour with sample data'),
  `<div class="li srow2" data-q="install home screen iphone android"><span class="lt" style="--c:var(--muted)">${ic('phone',18)}</span><span class="grow"><span class="t">Install on your phone</span><span class="s">iPhone: Safari → Share → Add to Home Screen. Android: Chrome → ⋮ → Install app.</span></span></div>`])}
 <div class="aboutf">${logoSVG(36)}<b>tempo<i>.</i></b><span>Version 6.0 · works offline</span></div>`}
function vBackup(){const h=vSettingsV2();const a=h.indexOf('<div class="sec"><div class="h2">Backup</div></div>');const b=h.lastIndexOf('<p class="hint">');return `${topbar('Backup and data')}<h1 class="h1">Backup and data</h1>`+(a>0?h.slice(a,b>a?b:undefined):'')}

/* --- visual customization --- */
function visPreview(){const v=vis();return `<div class="vprev"><div class="vp-top"><span class="eyebrow">Today</span>${ic('cog',14)}</div>
 <div class="vp-row"><div class="vp-card"><span class="eyebrow">Streak</span><b class="vp-num">12</b><small>weeks</small></div>
 <div class="vp-card vp-ring">${ringSVG2(.78,'var(--accent)',6)}<b>78</b></div></div>
 <div class="vp-btn">Start workout</div><div class="vp-tabs">${['home','train','progress','you'].map((i,k)=>`<span class="${k?'':'on'}">${ic(i,16)}<em>${['Today','Train','Progress','You'][k]}</em></span>`).join('')}</div></div>`}
function vVisual(){const v=vis();const st=S.settings;const opt=(k,lab,cls='')=>`<div class="vfield"><span class="vlab">${lab}</span>${seg(VIS_OPTS[k].map(o=>[o[0],o[1]]),v[k],'vis',`data-k="${k}"`,cls)}</div>`;
 return `${topbar('Visual customization')}<h1 class="h1">Look and feel</h1>
 <div class="vsticky">${visPreview()}</div>
 <section class="sgroup"><div class="sgt">Style</div><div class="stylepick">${VIS_OPTS.style.map(([k,l,d])=>`<button class="stcard ${v.style===k?'on':''}" data-act="vis" data-k="style" data-val="${k}"><span class="stsw st-${k}"><i></i><i></i><i></i></span><b>${l}</b><small>${d}</small></button>`).join('')}</div></section>
 <section class="sgroup"><div class="sgt">Accent</div><div class="swatches acc">${ACC_ORDER.filter(k=>ACCENTS[k]).map(k=>`<button class="swatch ${(st.accent||'aurora')===k?'on':''}" style="--c:${ACCENTS[k][0]};background:${ACCENTS[k][0]}" data-act="accent" data-k="${k}" aria-label="${ACCENTS[k][2]}">${(st.accent||'aurora')===k?ic('check',18):''}</button>`).join('')}</div><p class="hint">${esc((ACCENTS[st.accent]||ACCENTS.aurora)[2])}. Used for buttons, rings and highlights.</p></section>
 <section class="sgroup"><div class="sgt">Background</div>${seg(VIS_OPTS.bg,vis().bg,'vis','data-k="bg"')}<p class="hint">Readiness glow tints the top of the screen green, yellow or red with how ready you are.</p></section>
 <section class="sgroup"><div class="sgt">Type</div><div class="fontpick">${VIS_OPTS.font.map(([k,l])=>`<button class="fcard ${v.font===k?'on':''}" data-act="vis" data-k="font" data-val="${k}"><b class="ff-${k}">Aa 72</b><small>${l}</small></button>`).join('')}</div>${opt('numw','Number weight')}</section>
 <section class="sgroup"><div class="sgt">Layout</div>${opt('radius','Corners')}${opt('density','Spacing')}
  <div class="list">${setTogV('labels','Tab labels','Show names under the tab icons')}${setTogV('borders','Card outlines','A thin line around cards')}</div></section>
 <section class="sgroup"><div class="sgt">Accessibility</div><div class="vfield"><span class="vlab">Text size</span>${seg([['normal','Normal'],['large','Large']],st.textSize||'normal','setPref','data-k="textSize"')}</div><div class="vfield"><span class="vlab">Motion</span>${seg([['full','Full'],['reduced','Reduced']],st.motion||'full','setPref','data-k="motion"')}</div></section>
 <button class="btn line" data-act="visReset">Reset look to default</button>`}
const setTogV=(k,t,s)=>{const on=vis()[k]!=='off';return `<div class="li srow2 stog"><span class="grow"><span class="t">${t}</span><span class="s">${s}</span></span><button class="switch ${on?'on':''}" data-act="visTog" data-k="${k}" role="switch" aria-checked="${on}" aria-label="${t}"><span class="knob"></span></button></div>`};
Object.assign(VIEWS,{settings:vSettings,visual:vVisual,appearance:vVisual,backup:vBackup});
Object.assign(ACT,{
 togSet:d=>{S.settings[d.k]=S.settings[d.k]===false;save();render()},
 vis:d=>{const nv={...vis(),[d.k]:d.val};if(d.k==='style'){if(d.val==='glass')nv.bg='aurora';else if(vis().style==='glass'&&nv.bg==='aurora')nv.bg='tint'}S.settings.vis=nv;applyTheme();save();render()},
 visTog:d=>{const v=vis();S.settings.vis={...v,[d.k]:v[d.k]==='off'?'on':'off'};applyTheme();save();render()},
 visReset:()=>{S.settings.vis={...VIS_DEFAULT};S.settings.accent='aurora';S.settings.textSize='normal';S.settings.motion='full';applyTheme();save();render();toast('Look reset')},
 accent:d=>{S.settings.accent=d.k;applyTheme();save();render()}});
document.addEventListener('input',e=>{if(e.target.dataset&&e.target.dataset.live==='settings'){const q=norm(e.target.value);document.querySelectorAll('.srow2').forEach(r=>{r.hidden=!!q&&!(r.dataset.q||'').includes(q)&&!norm(r.textContent).includes(q)});document.querySelectorAll('.sgroup').forEach(g=>{g.hidden=!!q&&![...g.querySelectorAll('.srow2')].some(r=>!r.hidden)})}});
if(!I.phone)I.phone='<rect x="7" y="2.5" width="10" height="19" rx="2.5"/><path d="M11 18.5h2"/>';
if(!I.download)I.download='<path d="M12 4v11M7 10.5l5 5 5-5M5 20h14"/>';

(async function boot(){
 await DB.open();let raw=await DB.get('state');
 if(!raw){try{const ls=localStorage.getItem('ss-state');if(ls)raw=JSON.parse(ls)}catch(e){}}
 S=raw&&raw.v?migrate(raw):makeSample();
 applyTheme();stamp(true);closeWeeks();
 const ret=stravaReturn();
 render();ui.inSync=true;save();ui.inSync=false;
 try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
 try{if(document.querySelector('link[rel="manifest"]')&&'serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{})}catch(e){}
 if(ret)await handleStravaReturn(ret);
 await syncNow();
 if(S.strava.access&&Date.now()-(S.strava.checked||0)>30*60e3)stravaCheck(true);
})();
